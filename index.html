// ── 종결보고서 (읽기 전용 스타일 리포트): 컬러/사이즈별 오더내역 + 출고 + 비용 내역 ──
function styleOrderLines(style) {
  return S.data.filter(r => String(r.style || '(스타일 없음)') === style).map(calculateRowCosts)
    .sort((a, b) => String(a.color || '').localeCompare(String(b.color || '')));
}

function openClosingReport(style) {
  S.post.closingReportStyle = style;
  render();
}
function closeClosingReport() { S.post.closingReportStyle = null; render(); }

function renderClosingReportModal() {
  const style = S.post.closingReportStyle;
  if (!style) return '';
  const Lx = L(); const P = Lx.post;
  const lines = styleOrderLines(style);
  if (lines.length === 0) return '';
  const buyers = [...new Set(lines.map(r => r.buyer).filter(Boolean))].join(', ');
  const orderQty = lines.reduce((s, r) => s + r.totalQty, 0);
  const plannedSales = lines.reduce((s, r) => s + r.amount, 0);
  const avgFob = orderQty > 0 ? plannedSales / orderQty : 0;
  const a = S.actuals[style] || null;
  const shippedQty = a ? Number(a.shippedQty) || 0 : 0;
  const rate = a ? Number(a.rate) || 0 : 0;
  const autoSales = shippedQty * avgFob;
  const actualSales = a ? ((a.actualSalesUsd === '' || a.actualSalesUsd == null) ? autoSales : Number(a.actualSalesUsd) || 0) : 0;
  const shipRate = orderQty > 0 && a ? (shippedQty / orderQty) * 100 : 0;

  const items = styleCostItems(style);
  let paidVnd = 0;
  const itemRows = items.map(it => {
    const paid = a && a.items ? Number(a.items[it.key]) || 0 : 0;
    paidVnd += paid;
    const paidUsd = rate > 0 ? paid / rate : 0;
    return { ...it, paid, paidUsd };
  });
  const otherPaidVnd = a ? Number(a.otherPaidVnd) || 0 : 0;
  const packingPaidVnd = a ? Number(a.packingPaidVnd) || 0 : 0;
  paidVnd += otherPaidVnd + packingPaidVnd;
  const paidUsd = rate > 0 ? paidVnd / rate : 0;
  const actualProfit = a ? actualSales - paidUsd : 0;
  const plannedFabricUsd = lines.reduce((s, r) => s + r.totalFabricCost * r.totalQty, 0);
  const plannedTrimUsd = lines.reduce((s, r) => s + r.totalTrimCost * r.totalQty, 0);
  const cmtTotal = lines.reduce((s, r) => s + (Number(r.cmt) || 0) * r.totalQty, 0);
  const plannedProfit = plannedSales - plannedFabricUsd - plannedTrimUsd - cmtTotal;
  const actualMargin = actualSales > 0 ? (actualProfit / actualSales) * 100 : 0;
  const plannedMargin = plannedSales > 0 ? (plannedProfit / plannedSales) * 100 : 0;

  return `<div class="fixed inset-0 bg-slate-900/60 flex items-start justify-center overflow-auto p-4" style="z-index:150">
    <div class="bg-white rounded-xl shadow-2xl w-full my-8" style="max-width:1120px">
      <div class="p-4 border-b border-slate-200 bg-purple-50/60 rounded-t-xl flex items-center justify-between">
        <div class="flex items-center gap-2 min-w-0">
          <i data-lucide="flag" class="w-5 h-5 text-purple-600 shrink-0"></i>
          <div class="min-w-0">
            <h2 class="font-bold text-slate-800 truncate">${esc(style)} <span class="font-normal text-slate-400 text-sm">${P.closingReportTitle}</span></h2>
            <p class="text-xs text-slate-500 truncate">${esc(buyers)} · ${lines.length} lines · ${P.popupOrderPrefix}${fmtInt(orderQty)} pcs · avg FOB ${fmtMoney(avgFob, 2)}</p>
          </div>
        </div>
        <div class="flex items-center gap-2 shrink-0">
          <button data-action="editFromReport" data-id="${esc(style)}" class="flex items-center gap-1.5 text-xs font-bold text-purple-700 bg-purple-50 border border-purple-200 px-3 py-1.5 rounded-lg hover:bg-purple-100 transition-colors"><i data-lucide="pencil" class="w-3.5 h-3.5"></i> ${P.closingEditBtn}</button>
          <button data-action="closeClosingReport" class="p-1.5 text-slate-400 hover:text-slate-700 hover:bg-slate-200 rounded-lg transition-colors"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
      </div>

      <div class="p-6 space-y-4">
        <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
          ${summaryCard('package', P.thOrderQty, fmtInt(orderQty) + ' pcs', '', 'bg-slate-100 text-slate-600')}
          ${summaryCard('truck', P.thShippedQty, a ? fmtInt(shippedQty) + ' pcs' : '-', a ? shipRate.toFixed(1) + '% ' + P.thShipRate : P.statusMissing, a ? (shipRate >= 100 ? 'bg-emerald-50 text-emerald-600' : 'bg-amber-50 text-amber-600') : 'bg-slate-100 text-slate-400')}
          ${summaryCard('dollar-sign', P.cardSales, a ? fmtMoney(actualSales) : '-', P.cardPlanned(fmtMoney(plannedSales)), 'bg-emerald-50 text-emerald-600')}
          ${summaryCard('trending-up', P.cardProfit, a ? fmtMoney(actualProfit) + ' · ' + actualMargin.toFixed(1) + '%' : '-', a ? '' : P.cardPlanned(fmtMoney(plannedProfit) + ' · ' + plannedMargin.toFixed(1) + '%'), a ? getMarginBadgeClass(actualMargin) : 'bg-slate-100 text-slate-400')}
        </div>

        <div class="space-y-2">
          <p class="text-xs font-bold text-slate-600 flex items-center gap-1.5"><i data-lucide="palette" class="w-3.5 h-3.5"></i> ${P.closingColorSize}</p>
          <div class="overflow-x-auto border border-slate-200 rounded-lg">
            <table class="w-full text-xs text-left border-collapse">
              <thead class="text-slate-500 bg-slate-50 uppercase" style="font-size:10px"><tr>
                <th class="px-3 py-2 font-semibold">PO</th>
                <th class="px-3 py-2 font-semibold">Color</th>
                <th class="px-2 py-2 font-semibold text-right">S</th>
                <th class="px-2 py-2 font-semibold text-right">M</th>
                <th class="px-2 py-2 font-semibold text-right">L</th>
                <th class="px-2 py-2 font-semibold text-right">XL</th>
                <th class="px-2 py-2 font-semibold text-right">XXL</th>
                <th class="px-2 py-2 font-semibold text-right">${P.thOrderQty}</th>
                <th class="px-2 py-2 font-semibold">Delivery</th>
              </tr></thead>
              <tbody class="divide-y divide-slate-100">
                ${lines.map(r => `<tr>
                  <td class="px-3 py-1.5 text-slate-600">${esc(r.po)}</td>
                  <td class="px-3 py-1.5 font-semibold text-slate-700">${esc(r.color)}</td>
                  <td class="px-2 py-1.5 text-right text-slate-500">${fmtInt(r.s)}</td>
                  <td class="px-2 py-1.5 text-right text-slate-500">${fmtInt(r.m)}</td>
                  <td class="px-2 py-1.5 text-right text-slate-500">${fmtInt(r.l)}</td>
                  <td class="px-2 py-1.5 text-right text-slate-500">${fmtInt(r.xl)}</td>
                  <td class="px-2 py-1.5 text-right text-slate-500">${fmtInt(r.xxl)}</td>
                  <td class="px-2 py-1.5 text-right font-bold text-blue-700">${fmtInt(r.totalQty)}</td>
                  <td class="px-2 py-1.5 text-slate-500">${esc(r.delivery)}</td>
                </tr>`).join('')}
                <tr class="bg-slate-50 font-bold border-t-2 border-slate-200">
                  <td colspan="7" class="px-3 py-1.5 text-right text-slate-600">TOTAL</td>
                  <td class="px-2 py-1.5 text-right text-blue-700">${fmtInt(orderQty)}</td>
                  <td></td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <div class="space-y-2">
          <p class="text-xs font-bold text-amber-700 flex items-center gap-1.5"><i data-lucide="banknote" class="w-3.5 h-3.5"></i> ${P.popupPaidTitle}</p>
          ${items.length > 0 ? `
          <div class="overflow-x-auto border border-slate-200 rounded-lg">
            <table class="w-full text-xs text-left border-collapse">
              <thead class="text-slate-500 bg-slate-50 uppercase" style="font-size:10px"><tr>
                <th class="px-3 py-2 font-semibold">${P.thItem}</th>
                <th class="px-2 py-2 font-semibold text-right">${P.thUnitPlanned}</th>
                <th class="px-2 py-2 font-semibold text-right">${P.thPlannedTotal}</th>
                <th class="px-2 py-2 font-semibold text-right">${P.thPaidVnd}</th>
                <th class="px-2 py-2 font-semibold text-right">${P.thUsdConv}</th>
              </tr></thead>
              <tbody class="divide-y divide-slate-100">
                ${itemRows.map(it => `<tr class="${it.key === 'cmt' ? 'bg-indigo-50/40' : ''}">
                  <td class="px-3 py-1.5 font-semibold text-slate-700">${it.key === 'cmt' ? '<i data-lucide="scissors" class="w-3 h-3 inline text-indigo-500 mr-1"></i>' : ''}${esc(it.label)}</td>
                  <td class="px-2 py-1.5 text-right text-slate-500">$${it.unitCost.toFixed(3)}</td>
                  <td class="px-2 py-1.5 text-right text-slate-500">${fmtMoney(it.costSum, 2)}</td>
                  <td class="px-2 py-1.5 text-right ${a ? 'text-amber-700 font-medium' : 'text-slate-300'}">${a && it.paid ? fmtInt(it.paid) + ' ₫' : '-'}</td>
                  <td class="px-2 py-1.5 text-right ${a ? 'text-slate-600' : 'text-slate-300'}">${a && it.paid ? fmtMoney(it.paidUsd, 2) : '-'}</td>
                </tr>`).join('')}
                ${packingPaidVnd > 0 ? `<tr><td class="px-3 py-1.5 font-semibold text-slate-700">${esc(P.packingCost.replace(' (₫)', ''))}</td><td class="px-2 py-1.5 text-right text-slate-300">N/A</td><td class="px-2 py-1.5 text-right text-slate-300">-</td><td class="px-2 py-1.5 text-right text-amber-700 font-medium">${fmtInt(packingPaidVnd)} ₫</td><td class="px-2 py-1.5 text-right text-slate-600">${fmtMoney(rate > 0 ? packingPaidVnd / rate : 0, 2)}</td></tr>` : ''}
                ${otherPaidVnd > 0 ? `<tr><td class="px-3 py-1.5 font-semibold text-slate-700">${esc(P.otherCost.replace(' (₫)', ''))}</td><td class="px-2 py-1.5 text-right text-slate-300">N/A</td><td class="px-2 py-1.5 text-right text-slate-300">-</td><td class="px-2 py-1.5 text-right text-amber-700 font-medium">${fmtInt(otherPaidVnd)} ₫</td><td class="px-2 py-1.5 text-right text-slate-600">${fmtMoney(rate > 0 ? otherPaidVnd / rate : 0, 2)}</td></tr>` : ''}
                <tr class="bg-slate-50 font-bold border-t-2 border-slate-200">
                  <td class="px-3 py-1.5 text-slate-700">TOTAL</td><td></td>
                  <td class="px-2 py-1.5 text-right text-slate-600">${fmtMoney(plannedFabricUsd + plannedTrimUsd + cmtTotal, 2)}</td>
                  <td class="px-2 py-1.5 text-right text-amber-700">${a ? fmtInt(paidVnd) + ' ₫' : '-'}</td>
                  <td class="px-2 py-1.5 text-right text-slate-700">${a ? fmtMoney(paidUsd, 2) : '-'}</td>
                </tr>
              </tbody>
            </table>
          </div>` : `<p class="text-xs text-slate-400 italic px-1">${P.noItems}</p>`}
        </div>

        ${a && a.memo ? `<div class="bg-slate-50 border border-slate-200 rounded-lg p-3 text-xs"><span class="font-bold text-slate-600">${P.memoLabel}:</span> <span class="text-slate-600">${esc(a.memo)}</span></div>` : ''}
        ${!a ? `<div class="bg-amber-50 border border-amber-200 rounded-lg p-3 text-xs text-amber-700 flex items-center gap-2"><i data-lucide="alert-triangle" class="w-4 h-4 shrink-0"></i> ${P.closingNotEnteredHint}</div>` : ''}
      </div>

}

// ── 실적 입력 팝업 ──
function openActual(style) {

  const { list } = computePostData();
  const ref = list.find(g => g.style === style);
  if (!ref) return;
  const a = S.actuals[style];
  const lastRate = Number(localStorage.getItem(LAST_RATE_KEY)) || 26267;
  const items = styleCostItems(style);

  const itemPayVnd = {};
  const itemQty = {};
  const itemBreakdown = {};
  const breakdownOpen = {};
  items.forEach(it => { itemPayVnd[it.key] = ''; itemQty[it.key] = it.qty; }); // 수량 기본값 = 오더수량, 사용자가 변경 가능
  if (a && a.items) Object.keys(a.items).forEach(k => { itemPayVnd[k] = a.items[k]; });
  if (a && a.itemQty) Object.keys(a.itemQty).forEach(k => { itemQty[k] = a.itemQty[k]; });
  if (a && a.itemBreakdown) Object.keys(a.itemBreakdown).forEach(k => {
    itemBreakdown[k] = (a.itemBreakdown[k] || []).map(r => ({ label: r.label || '', amount: r.amount ?? '' }));
    if (itemBreakdown[k].length > 0) breakdownOpen[k] = true;
  });
  // ✅ CM(공임)은 처음 입력 시 계획단가 기준 금액을 기본값으로 채워둔다 (비워두면 실제이익이 CM 비용 없이 과대계상되는 걸 방지).
  //    사용자가 실제 지급액으로 수정하면 그 값이 저장된다.
  if (!a) {
    const cmtItem = items.find(it => it.key === 'cmt');
    if (cmtItem && cmtItem.costSum > 0) itemPayVnd['cmt'] = Math.round(cmtItem.costSum * lastRate);
  }

  // 구버전 호환: items 없이 fabricPaidVnd/trimPaidVnd로만 저장된 실적은 레거시 항목으로 표시
  const legacyItems = [];
  if (a && !a.items) {
    if (Number(a.fabricPaidVnd) > 0) legacyItems.push({ key: 'legacy:fabric', label: L().post.legacyFabric, qty: 0, unitCost: 0, legacy: true });
    if (Number(a.trimPaidVnd) > 0) legacyItems.push({ key: 'legacy:trim', label: L().post.legacyTrim, qty: 0, unitCost: 0, legacy: true });
    if (Number(a.fabricPaidVnd) > 0) itemPayVnd['legacy:fabric'] = a.fabricPaidVnd;
    if (Number(a.trimPaidVnd) > 0) itemPayVnd['legacy:trim'] = a.trimPaidVnd;
  }

  S.post.popup = {
    style,
    ref: { orderQty: ref.orderQty, avgFob: ref.avgFob, cmtUnit: ref.cmtUnit, plannedSales: ref.plannedSales, plannedFabricUsd: ref.plannedFabricUsd, plannedTrimUsd: ref.plannedTrimUsd, plannedProfit: ref.plannedProfit, buyers: ref.buyers, lines: ref.lines },
    items: [...items, ...legacyItems],
    draft: a
      ? { shippedQty: a.shippedQty ?? '', actualSalesUsd: a.actualSalesUsd ?? '', rate: a.rate ?? lastRate, otherPaidVnd: a.otherPaidVnd ?? '', packingPaidVnd: a.packingPaidVnd ?? '', memo: a.memo || '', itemPayVnd, itemQty, itemBreakdown, breakdownOpen }
      : { shippedQty: '', actualSalesUsd: '', rate: lastRate, otherPaidVnd: '', packingPaidVnd: '', memo: '', itemPayVnd, itemQty, itemBreakdown, breakdownOpen },
    exists: !!a
  };
  render();
}

// 항목별 세부내역(breakdown) 합계를 다시 계산해서 itemPayVnd에 동기화 (breakdown 사용 중일 때 항상 소스오브트루스)
function syncBreakdownTotal(key) {
  const p = S.post.popup;
  if (!p) return;
  const rows = p.draft.itemBreakdown[key];
  if (rows && rows.length > 0) {
    const sum = rows.reduce((s, r) => s + (Number(r.amount) || 0), 0);
    p.draft.itemPayVnd[key] = sum;
  }
}

function actualDerived() {
  const p = S.post.popup;
  if (!p) return null;
  const d = p.draft, r = p.ref;
  const shippedQty = Number(d.shippedQty) || 0;
  const rate = Number(d.rate) || 0;
  const autoSales = shippedQty * r.avgFob;
  const isAutoSales = d.actualSalesUsd === '' || d.actualSalesUsd == null;
  const actualSales = isAutoSales ? autoSales : Number(d.actualSalesUsd) || 0;

  const itemUsd = {}, itemUnit = {};
  let itemsPaidVnd = 0;
  p.items.forEach(it => {
    const vnd = Number(d.itemPayVnd[it.key]) || 0;
    itemsPaidVnd += vnd;
    const usd = rate > 0 ? vnd / rate : 0;
    itemUsd[it.key] = usd;
    const qty = Number(d.itemQty[it.key]) || 0; // ✅ 사용자가 변경 가능한 수량 기준으로 실제단가 계산
    itemUnit[it.key] = qty > 0 ? usd / qty : 0;
  });
  const oth = Number(d.otherPaidVnd) || 0;
  const othUsd = rate > 0 ? oth / rate : 0;
  const packing = Number(d.packingPaidVnd) || 0;
  const packingUsd = rate > 0 ? packing / rate : 0;
  const paidUsd = (rate > 0 ? itemsPaidVnd / rate : 0) + othUsd + packingUsd;
  const actualProfit = actualSales - paidUsd;
  const margin = actualSales > 0 ? (actualProfit / actualSales) * 100 : 0;
  const diff = actualProfit - r.plannedProfit;
  return { shippedQty, rate, autoSales, isAutoSales, actualSales, itemUsd, itemUnit, othUsd, packingUsd, paidUsd, actualProfit, margin, diff };
}

function saveActualFromPopup() {
  const p = S.post.popup;
  if (!p) return;
  const P = L().post;
  const d = p.draft;
  if (d.shippedQty === '' || Number(d.shippedQty) < 0) { window.alert(P.alertShippedQty); return; }
  if (!Number(d.rate) || Number(d.rate) <= 0) { window.alert(P.alertRate); return; }

  const items = {};
  const itemQty = {};
  const itemBreakdown = {};
  p.items.forEach(it => {
    const v = Number(d.itemPayVnd[it.key]) || 0;
    if (v > 0) items[it.key] = v;
    itemQty[it.key] = Number(d.itemQty[it.key]) || 0;
    const rows = (d.itemBreakdown[it.key] || []).filter(r => (r.label && r.label.trim()) || Number(r.amount) > 0);
    if (rows.length > 0) itemBreakdown[it.key] = rows.map(r => ({ label: r.label || '', amount: Number(r.amount) || 0 }));
  });

  const payload = {
    shippedQty: Number(d.shippedQty) || 0,
    actualSalesUsd: d.actualSalesUsd === '' ? '' : Number(d.actualSalesUsd) || 0,
    rate: Number(d.rate),
    items,
    itemQty,
    itemBreakdown,
    otherPaidVnd: Number(d.otherPaidVnd) || 0,
    packingPaidVnd: Number(d.packingPaidVnd) || 0,
    memo: String(d.memo || ''),
    updatedBy: S.currentUser?.id || '',
    updatedAt: new Date().toISOString()
  };
  try { localStorage.setItem(LAST_RATE_KEY, String(payload.rate)); } catch (e) {}
  saveActual(p.style, payload);
  S.post.popup = null;
  render();
}

// 10. MASTER RENDER (포커스 보존) + 부트스트랩

const appEl = document.getElementById('app');

function cssEsc(s) { return (window.CSS && CSS.escape) ? CSS.escape(String(s)) : String(s).replace(/(["\\])/g, '\\$1'); }

function buildFocusSelector(el) {
  if (!el || !el.dataset) return null;
  if (el.id) return '#' + cssEsc(el.id);
  const ds = el.dataset;
  if (ds.cellInput !== undefined) return `[data-cell-input][data-id="${cssEsc(ds.id)}"][data-field="${cssEsc(ds.field)}"]`;
  if (ds.actualField) return `[data-actual-field="${cssEsc(ds.actualField)}"]`;
  if (ds.actualItem) return `[data-actual-item="${cssEsc(ds.actualItem)}"]`;
  if (ds.actualQty) return `[data-actual-qty="${cssEsc(ds.actualQty)}"]`;
  if (ds.breakdownLabel) return `[data-breakdown-label="${cssEsc(ds.breakdownLabel)}"]`;
  if (ds.breakdownAmount) return `[data-breakdown-amount="${cssEsc(ds.breakdownAmount)}"]`;
  if (ds.cmField) return `[data-cm-field="${cssEsc(ds.cmField)}"]`;
  if (ds.party) return `[data-party="${cssEsc(ds.party)}"][data-field="${cssEsc(ds.field)}"]`;
  if (ds.lineField) return `[data-line-field="${cssEsc(ds.lineField)}"]`;
  if (ds.linePrice) return `[data-line-price="${cssEsc(ds.linePrice)}"]`;
  if (ds.mergeTarget) return `[data-merge-target="${cssEsc(ds.mergeTarget)}"]`;
  if (ds.bind) return `[data-bind="${cssEsc(ds.bind)}"]`;
  if (ds.actionChange) return `[data-action-change="${cssEsc(ds.actionChange)}"]`;
  return null;
}

function buildAppHtml() {
  if (!S.authChecked) {
    return `<div class="min-h-screen flex items-center justify-center bg-slate-50"><div class="flex items-center gap-2 text-slate-400 text-sm"><i data-lucide="rotate-ccw" class="w-4 h-4 animate-spin"></i> 불러오는 중...</div></div>`;
  }
  if (!S.isAuthenticated) return renderLogin();
  if (!S.appMode) return renderModePicker();

  return `<div class="h-screen overflow-hidden bg-slate-50 flex flex-col font-sans">
    <input type="file" id="csvFileInput" accept=".csv" class="hidden" />
    ${renderHeader()}
    <main class="flex-1 overflow-hidden p-4 lg:px-6 w-full flex flex-col">
      ${S.appMode === 'post' ? renderPostMode() : (S.activeTab === 'dashboard' ? renderDashboard() : renderDataSheet())}
    </main>
    ${CM ? renderContractModal() : ''}
    ${S.showSettingsModal ? renderSettingsModal() : ''}
    ${S.post.popup ? renderActualPopup() : ''}
    ${S.post.closingReportStyle ? renderClosingReportModal() : ''}
  </div>`;
}

function render() {
  const active = document.activeElement;
  let restore = null;
  if (active && appEl.contains(active) && ['INPUT', 'SELECT', 'TEXTAREA'].includes(active.tagName)) {
    const selector = buildFocusSelector(active);
    if (selector) {
      restore = { selector, selStart: active.selectionStart, selEnd: active.selectionEnd, scrollTop: active.scrollTop };
    }
  }
  appEl.innerHTML = buildAppHtml();
  refreshIcons();
  if (restore) {
    try {
      const el = document.querySelector(restore.selector);
      if (el) {
        el.focus();
        if (typeof el.setSelectionRange === 'function' && restore.selStart != null && (el.type === 'text' || el.type === 'search' || el.tagName === 'TEXTAREA' || !el.type)) {
          el.setSelectionRange(restore.selStart, restore.selEnd);
        }
      }
    } catch (e) { /* ignore */ }
  }
  if (S.sheet.editingId != null) {
    const el = document.querySelector(`[data-cell-input][data-id="${cssEsc(S.sheet.editingId)}"][data-field="${cssEsc(S.sheet.editingField)}"]`);
    if (el && document.activeElement !== el) el.focus();
  }
  wireOneTimeHandlers();
}

// 11. 전역 위임 이벤트 처리 (한 번만 등록 — appEl 자체는 재생성되지 않음)

const RULE_A_LINE_FIELDS = new Set(['qty', 'priceUsd', 'cons', 'loss', 'orderQty']);
const RULE_A_CM_FIELDS = new Set(['rate', 'vatPercent']);

function setByPath(obj, path, value) {
  const parts = path.split('.');
  let o = obj;
  for (let i = 0; i < parts.length - 1; i++) o = o[parts[i]];
  o[parts[parts.length - 1]] = value;
}

function handleClick(e) {
  const t = e.target.closest('[data-action]');
  if (!t) return;
  const action = t.dataset.action;
  const id = t.dataset.id;
  const val = t.dataset.val;

  switch (action) {
    // ── Header ──
    case 'openContractHeader': openContractFromHeader(); break;
    case 'openSettings': S.showSettingsModal = true; render(); break;
    case 'closeSettings': S.showSettingsModal = false; render(); break;
    case 'refresh': loadAll(true); break;
    case 'triggerCsvImport': document.getElementById('csvFileInput')?.click(); break;
    case 'exportCsv': handleExportCSV(); break;
    case 'setTab': S.activeTab = val; render(); break;
    case 'logout': doLogout(); break;

    // ── Dashboard ──
    case 'chartMetric': S.dash.chartMetric = val; render(); break;

    // ── Data Sheet ──
    case 'toggleAll': {
      const ids = id ? id.split('|').map(Number) : [];
      toggleAllRows(ids);
      break;
    }
    case 'toggleStyle': {
      const ids = id.split('|').map(Number);
      const allIn = ids.every(rid => S.selectedRowIds.has(rid));
      toggleStyle(ids, !allIn);
      break;
    }
    case 'toggleRow': toggleRow(Number(id)); break;
    case 'sort': {
      let dir = 'asc';
      if (S.sheet.sortKey === val && S.sheet.sortDir === 'asc') dir = 'desc';
      S.sheet.sortKey = val; S.sheet.sortDir = dir; render();
      break;
    }
    case 'clearSearch': S.sheet.searchTerm = ''; render(); break;
    case 'toggleFabric': S.sheet.showFabric = !S.sheet.showFabric; render(); break;
    case 'toggleTrims': S.sheet.showTrims = !S.sheet.showTrims; render(); break;
    case 'addRow': handleAddRow(); break;
    case 'openContractOne': openContractModal([Number(id)]); break;
    case 'insertRowAfter': {
      const row = S.data.find(r => r.id === Number(id));
      if (row) handleInsertRowAfter(row);
      break;
    }
    case 'deleteRow': if (window.confirm('이 행을 삭제하시겠습니까?')) handleDeleteOrderRow(Number(id)); break;

    // ── Settings: Supplier ──
    case 'supNew': supplierPanelState = { editingId: 'new', form: { ...emptySupplier } }; render(); break;
    case 'supEdit': { const sup = S.suppliers.find(s => String(s.id) === id); supplierPanelState = { editingId: id, form: { ...sup } }; render(); break; }
    case 'supCancel': supplierPanelState.editingId = null; render(); break;
    case 'supSave': {
      const form = supplierFormRead();
      if (!form.nameVN.trim() && !form.nameEN.trim()) { window.alert('회사명을 입력해주세요.'); return; }
      let next;
      if (supplierPanelState.editingId === 'new') next = [...S.suppliers, { ...form, id: 'sup-' + Date.now() }];
      else next = S.suppliers.map(s => String(s.id) === supplierPanelState.editingId ? { ...form, id: s.id } : s);
      saveSuppliers(next);
      supplierPanelState.editingId = null;
      render();
      break;
    }
    case 'supDelete': if (window.confirm('이 거래처를 삭제하시겠습니까?')) { saveSuppliers(S.suppliers.filter(s => String(s.id) !== id)); if (supplierPanelState.editingId === id) supplierPanelState.editingId = null; render(); } break;
    case 'settingsTab': S.settings.tab = val; render(); break;

    // ── Settings: Buyer ──
    case 'buyerAdd': {
      const name = (document.getElementById('buyerNewName')?.value || '').trim();
      if (!name) return;
      const nameSet = new Set(); S.buyers.forEach(b => { nameSet.add(b.name); (b.aliases || []).forEach(a => nameSet.add(a)); });
      if (nameSet.has(name)) { window.alert('이미 등록된 바이어명(또는 별칭)입니다.'); return; }
      saveBuyers([...S.buyers, { id: 'buyer-' + Date.now(), name, aliases: [] }]);
      buyerPanelState.newName = ''; render();
      break;
    }
    case 'buyerStartEdit': { const b = S.buyers.find(x => String(x.id) === id); buyerPanelState.editingId = id; buyerPanelState.editName = b.name; render(); break; }
    case 'buyerCancelEdit': buyerPanelState.editingId = null; render(); break;
    case 'buyerSaveEdit': {
      const inputEl = document.getElementById('buyerEditName_' + id);
      const name = (inputEl?.value || '').trim();
      if (!name) return;
      saveBuyers(S.buyers.map(b => String(b.id) === id ? { ...b, name } : b));
      buyerPanelState.editingId = null; render();
      break;
    }
    case 'buyerDelete': if (window.confirm('이 바이어를 목록에서 삭제하시겠습니까?\n(별칭도 함께 삭제되며, 이미 입력된 오더의 데이터는 그대로 남습니다)')) { saveBuyers(S.buyers.filter(b => String(b.id) !== id)); render(); } break;
    case 'buyerQuickRegister': {
      const name = t.dataset.name;
      const nameSet = new Set(); S.buyers.forEach(b => { nameSet.add(b.name); (b.aliases || []).forEach(a => nameSet.add(a)); });
      if (nameSet.has(name)) return;
      saveBuyers([...S.buyers, { id: 'buyer-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6), name, aliases: [] }]);
      render();
      break;
    }
    case 'buyerMergeAlias': {
      const rawName = t.dataset.name;
      const targetId = buyerPanelState.mergeTarget[rawName];
      if (!targetId) { window.alert('먼저 병합할 표준 바이어를 선택하세요.'); return; }
      saveBuyers(S.buyers.map(b => String(b.id) === targetId ? { ...b, aliases: [...new Set([...(b.aliases || []), rawName])] } : b));
      delete buyerPanelState.mergeTarget[rawName];
      render();
      break;
    }
    case 'buyerAddAlias': {
      const draftEl = document.getElementById('buyerAliasDraft_' + id);
      const alias = (draftEl?.value || '').trim();
      if (!alias) return;
      const nameSet = new Set(); S.buyers.forEach(b => { nameSet.add(b.name); (b.aliases || []).forEach(a => nameSet.add(a)); });
      if (nameSet.has(alias)) { window.alert('이미 등록된 이름(또는 다른 별칭)입니다.'); return; }
      saveBuyers(S.buyers.map(b => String(b.id) === id ? { ...b, aliases: [...new Set([...(b.aliases || []), alias])] } : b));
      buyerPanelState.aliasDraft[id] = ''; render();
      break;
    }
    case 'buyerRemoveAlias': {
      const alias = t.dataset.alias;
      saveBuyers(S.buyers.map(b => String(b.id) === id ? { ...b, aliases: (b.aliases || []).filter(a => a !== alias) } : b));
      render();
      break;
    }

    // ── Contract Modal ──
    case 'closeContract': closeContractModal(); break;
    case 'cmDocType': CM.docType = val; pickDefaultSupplier(); regenerateLines(); render(); break;
    case 'cmToggleTrim': { if (CM.selectedTrims.has(val)) CM.selectedTrims.delete(val); else CM.selectedTrims.add(val); regenerateLines(); render(); break; }
    case 'cmToggleSelector': CM.showSelector = !CM.showSelector; render(); break;
    case 'cmToggleRow': { const rid = Number(id); if (CM.selectedIds.has(rid)) CM.selectedIds.delete(rid); else CM.selectedIds.add(rid); regenerateLines(); render(); break; }
    case 'openSettingsFromContract': S.showSettingsModal = true; render(); break;
    case 'removeLine': removeLine(id); break;
    case 'resetOrderQty': updateLine(id, 'orderQty', ''); break;
    case 'cmExportPdf': handleExportPdf(); break;
    case 'cmDownloadHtml': handleDownloadHtml(); break;

    // ── Login ──
    case 'loginSubmit': doLogin(S.loginId || '', S.loginPw || ''); break;
    case 'openDbConfig': openDbConfigModal(); break;
    case 'setLangFlag': S.lang = val; try { localStorage.setItem(LANG_LOCAL_KEY, val); } catch (e) {} render(); break;
    case 'closeDbConfig': closeDbConfigModal(); break;
    case 'saveDbConfig': saveDbConfigFromModal(); break;

    // ── 사전/사후 모드 & 사후 실적 관리 ──
    case 'selectMode': S.appMode = val; render(); break;
    case 'postView': S.post.view = val; render(); break;
    case 'postFilterTab': S.post.filterTab = val; render(); break;
    case 'postChartMetric': S.post.chartMetric = val; render(); break;
    case 'postKpiFilterReset': S.post.kpiFilter = { year: 'ALL', buyer: 'ALL', item: 'ALL' }; render(); break;
    case 'postCompareFilterReset': S.post.compareFilter = { year: 'ALL', buyer: 'ALL', style: 'ALL' }; render(); break;
    case 'postClosingFilterReset': S.post.closingFilter = { year: 'ALL', month: 'ALL', buyer: 'ALL' }; render(); break;
    case 'openActual': openActual(id); break;
    case 'closeActual': S.post.popup = null; render(); break;
    case 'saveActualBtn': saveActualFromPopup(); break;
    case 'deleteActualBtn': {
      if (S.post.popup && window.confirm('이 스타일의 실적 데이터를 삭제하시겠습니까?')) {
        deleteActual(S.post.popup.style);
        S.post.popup = null;
        render();
      }
      break;
    }
    case 'openClosingReport': openClosingReport(id); break;
    case 'closeClosingReport': closeClosingReport(); break;
    case 'editFromReport': S.post.closingReportStyle = null; openActual(id); break;
    case 'toggleItemBreakdown': {
      const p = S.post.popup;
      if (!p) break;
      const key = id;
      const willOpen = !p.draft.breakdownOpen[key];
      p.draft.breakdownOpen[key] = willOpen;
      // 처음 펼칠 때 기존에 입력해둔 금액이 있으면 첫 줄로 옮겨서 이어서 세분화할 수 있게 함
      if (willOpen && (!p.draft.itemBreakdown[key] || p.draft.itemBreakdown[key].length === 0)) {
        const existing = Number(p.draft.itemPayVnd[key]) || 0;
        p.draft.itemBreakdown[key] = existing > 0 ? [{ label: '', amount: existing }] : [{ label: '', amount: '' }];
      }
      render();
      break;
    }
    case 'addBreakdownRow': {
      const p = S.post.popup;
      if (!p) break;
      if (!p.draft.itemBreakdown[id]) p.draft.itemBreakdown[id] = [];
      p.draft.itemBreakdown[id].push({ label: '', amount: '' });
      render();
      break;
    }
    case 'removeBreakdownRow': {
      const p = S.post.popup;
      if (!p) break;
      const idx = Number(t.dataset.idx);
      p.draft.itemBreakdown[id].splice(idx, 1);
      syncBreakdownTotal(id);
      if (p.draft.itemBreakdown[id].length === 0) p.draft.breakdownOpen[id] = false;
      render();
      break;
    }
  }
}

function handleDblClick(e) {
  const t = e.target.closest('[data-action="editCell"]');
  if (!t) return;
  const id = Number(t.dataset.id);
  const field = t.dataset.field;
  const row = computeProcessedData().find(r => !r.isSubtotal && r.id === id) || S.data.find(r => r.id === id);
  let value = row ? row[field] : '';
  if (value === 0 && typeof value === 'number') value = '';
  if (field === 'status' && !value) value = 'Open';
  S.sheet.editingId = id; S.sheet.editingField = field; S.sheet.editValue = value;
  render();
}

function handleChange(e) {
  const el = e.target;
  if (el.id === 'csvFileInput') { handleImportCSVFile(el.files[0]); el.value = null; return; }
  if (el.id === 'loginSubmitBtn') return;

  // Dashboard 필터 바인딩
  if (el.dataset.bind) { setByPath(S, el.dataset.bind, el.value); render(); return; }

  // 데이터시트 셀 편집 (select: status / buyer)
  if (el.dataset.cellInput !== undefined) { S.sheet.editValue = el.value; handleSaveAndMove(); return; }

  // 언어 변경
  if (el.dataset.actionChange === 'changeLang') {
    S.lang = el.value;
    try { localStorage.setItem(LANG_LOCAL_KEY, el.value); } catch (err) {}
    render(); return;
  }
  // 사후 실적 KPI / 비교 탭 — 연동형(cascading) 필터: 연도 바꾸면 바이어/항목·스타일 초기화, 바이어 바꾸면 항목·스타일 초기화
  if (el.dataset.actionChange === 'postKpiBuyer') { S.post.kpiFilter = { buyer: el.value, year: 'ALL', item: 'ALL' }; render(); return; }
  if (el.dataset.actionChange === 'postKpiYear') { S.post.kpiFilter.year = el.value; S.post.kpiFilter.item = 'ALL'; render(); return; }
  if (el.dataset.actionChange === 'postKpiItem') { S.post.kpiFilter.item = el.value; render(); return; }
  if (el.dataset.actionChange === 'postCompareBuyer') { S.post.compareFilter = { buyer: el.value, year: 'ALL', style: 'ALL' }; render(); return; }
  if (el.dataset.actionChange === 'postCompareYear') { S.post.compareFilter.year = el.value; S.post.compareFilter.style = 'ALL'; render(); return; }
  if (el.dataset.actionChange === 'postCompareStyle') { S.post.compareFilter.style = el.value; render(); return; }
  if (el.dataset.actionChange === 'postClosingBuyer') { S.post.closingFilter = { buyer: el.value, year: 'ALL', month: 'ALL' }; render(); return; }
  if (el.dataset.actionChange === 'postClosingYear') { S.post.closingFilter.year = el.value; S.post.closingFilter.month = 'ALL'; render(); return; }
  if (el.dataset.actionChange === 'postClosingMonth') { S.post.closingFilter.month = el.value; render(); return; }
  // 계약서: 공급처 선택
  if (el.dataset.actionChange === 'cmSelectSupplier') {
    CM.supplierId = el.value;
    const sup = S.suppliers.find(s => String(s.id) === el.value);
    if (sup) CM.seller = { ...sup };
    render(); return;
  }
  // 계약서: 단위(select), 라인 unit(select)
  if (el.dataset.cmField === 'unit') { CM.unit = el.value; render(); return; }
  if (el.dataset.lineField) {
    const [lineId, field] = el.dataset.lineField.split('::');
    updateLine(lineId, field, el.value);
    return;
  }
  // 바이어 병합 대상 선택
  if (el.dataset.mergeTarget) { buyerPanelState.mergeTarget[el.dataset.mergeTarget] = el.value; return; }
}

function handleSaveAndMove(direction) {
  if (S.sheet.editingId == null) return;
  const id = S.sheet.editingId, field = S.sheet.editingField;
  const rowIndex = S.data.findIndex(r => r.id === id);
  if (rowIndex === -1) { S.sheet.editingId = null; render(); return; }
  const row = { ...S.data[rowIndex] };
  const isStringField = stringFields.includes(field);
  let newValue = S.sheet.editValue;
  if (field === 'delivery') newValue = formatDeliveryDate(newValue);
  else if (!isStringField) { newValue = parseFloat(newValue); if (isNaN(newValue)) newValue = 0; }
  row[field] = newValue;
  handleUpsertRow(row);

  if (direction) {
    const curIdx = editableColumns.indexOf(field);
    const nextIdx = direction === 'next' ? curIdx + 1 : curIdx - 1;
    if (nextIdx >= 0 && nextIdx < editableColumns.length) {
      const nextField = editableColumns[nextIdx];
      S.sheet.editingId = id; S.sheet.editingField = nextField;
      S.sheet.editValue = row[nextField] === 0 ? '' : row[nextField];
    } else S.sheet.editingId = null;
  } else S.sheet.editingId = null;
  render();
}

function handleInput(e) {
  const el = e.target;
  // 콤마 포맷 대상 입력창은 편집 중 콤마가 섞여도 항상 원시 숫자로 정규화 (계산 오류 방지)
  if (el.dataset && el.dataset.fmt !== undefined && el.value.includes(',')) {
    const pos = el.selectionStart;
    const before = el.value.slice(0, pos).replace(/,/g, '').length;
    el.value = el.value.replace(/,/g, '');
    try { el.setSelectionRange(before, before); } catch (err) {}
  }
  // 검색창 (실시간 필터 — 버그 수정됨: 매 입력마다 렌더링되어 즉시 반영)
  if (el.id === 'searchInput') { S.sheet.searchTerm = el.value; render(); return; }
  // 사후 모드 검색창
  if (el.id === 'postSearchInput') { S.post.searchTerm = el.value; render(); return; }
  // 사후 실적 팝업 입력 — 포커스 보존 렌더링으로 파생값(USD 환산/이익/세부내역 합계) 전체 갱신
  if (el.dataset.actualField) {
    if (S.post.popup) { S.post.popup.draft[el.dataset.actualField] = el.value; render(); }
    return;
  }
  if (el.dataset.actualItem) {
    if (S.post.popup) {
      const p = S.post.popup;
      const key = el.dataset.actualItem;
      p.draft.itemPayVnd[key] = el.value;
      // 세부내역(breakdown)이 열려있지 않은 항목만 직접 수정 가능 — breakdown 사용 중이면 그쪽이 소스오브트루스
      render();
    }
    return;
  }
  if (el.dataset.actualQty) {
    if (S.post.popup) {
      const p = S.post.popup;
      const key = el.dataset.actualQty;
      p.draft.itemQty[key] = el.value;
      // ✅ CM은 사전단가(고정) × 적용수량 × 환율로 지불액(₫)을 자동 재계산 — "공임 단가는 그대로, 수량 바뀌면 합계도 바뀌어야 함"
      if (key === 'cmt' && !(p.draft.itemBreakdown['cmt'] && p.draft.itemBreakdown['cmt'].length > 0)) {
        const item = p.items.find(it => it.key === 'cmt');
        const rate = Number(p.draft.rate) || 0;
        const qty = Number(el.value) || 0;
        if (item && rate > 0) p.draft.itemPayVnd['cmt'] = Math.round(item.unitCost * qty * rate);
      }
      render();
    }
    return;
  }
  if (el.dataset.breakdownLabel) {
    if (S.post.popup) {
      const [key, idx] = el.dataset.breakdownLabel.split('::');
      S.post.popup.draft.itemBreakdown[key][Number(idx)].label = el.value;
      render();
    }
    return;
  }
  if (el.dataset.breakdownAmount) {
    if (S.post.popup) {
      const [key, idx] = el.dataset.breakdownAmount.split('::');
      S.post.popup.draft.itemBreakdown[key][Number(idx)].amount = el.value;
      syncBreakdownTotal(key);
      render();
    }
    return;
  }
  // 로그인 필드는 wireLogin 쪽에서 별도 처리하지 않고 여기서 상태만 저장 (렌더 없음)
  if (el.id === 'loginId') { S.loginId = el.value; return; }
  if (el.id === 'loginPw') { S.loginPw = el.value; return; }

  // 데이터시트 셀 편집 (text input) — 렌더 없이 상태만 갱신
  if (el.dataset.cellInput !== undefined) { S.sheet.editValue = el.value; return; }

  // 계약서 상단 필드 (contractNo, dates, rate, vat 등)
  if (el.dataset.cmField) {
    const field = el.dataset.cmField;
    CM[field] = el.value;
    if (RULE_A_CM_FIELDS.has(field)) render();
    return;
  }
  // 계약서 party 필드 (seller / buyerInfo)
  if (el.dataset.party) {
    const target = el.dataset.party, field = el.dataset.field;
    CM[target] = { ...CM[target], [field]: el.value };
    return; // 서명란 등은 blur 시 반영
  }
  // 계약서 라인 필드
  if (el.dataset.lineField) {
    const [lineId, field] = el.dataset.lineField.split('::');
    const idx = CM.lines.findIndex(l => l.lineId === lineId);
    if (idx !== -1) CM.lines[idx] = { ...CM.lines[idx], [field]: el.value };
    if (RULE_A_LINE_FIELDS.has(field)) render();
    return;
  }
  // 계약서 라인 단가 (같은 품목 아래로 자동 채움 + 총액 반영)
  if (el.dataset.linePrice) { updateLinePrice(el.dataset.linePrice, el.value); return; }
}

function handleFocusCapture(e) {
  const el = e.target;
  if (!el.dataset || el.dataset.fmt === undefined) return;
  // 편집 시작: 콤마 제거해서 원시 숫자만 보여줌
  if (el.value) el.value = el.value.replace(/,/g, '');
}

function handleBlurCapture(e) {
  const el = e.target;
  if (!el.dataset) return;
  if (el.dataset.fmt !== undefined) {
    // 편집 종료: 000,000.00 형태로 콤마 포맷
    const digits = Number(el.dataset.fmt) || 0;
    if (el.value !== '') el.value = fmtInputVal(el.value, digits);
  }
  if (el.dataset.cellInput !== undefined) { handleSaveAndMove(); return; }
  if ((el.dataset.cmField && !RULE_A_CM_FIELDS.has(el.dataset.cmField)) || el.dataset.party || (el.dataset.lineField && !RULE_A_LINE_FIELDS.has(el.dataset.lineField.split('::')[1]))) {
    if (el.dataset.party === 'buyerInfo') saveCompany(CM.buyerInfo);
    render();
  }
}

function handleKeydown(e) {
  const el = e.target;
  if (el.dataset && el.dataset.cellInput !== undefined) {
    if (e.key === 'Enter') { e.preventDefault(); handleSaveAndMove(); }
    else if (e.key === 'Tab') { e.preventDefault(); handleSaveAndMove(e.shiftKey ? 'prev' : 'next'); }
    else if (e.key === 'Escape') { S.sheet.editingId = null; render(); }
    return;
  }
  if (el.id === 'buyerNewName' && e.key === 'Enter') { document.querySelector('[data-action="buyerAdd"]')?.click(); }
  if (el.id && el.id.startsWith('buyerEditName_') && e.key === 'Enter') { document.querySelector(`[data-action="buyerSaveEdit"][data-id="${el.id.replace('buyerEditName_', '')}"]`)?.click(); }
  if (el.id && el.id.startsWith('buyerAliasDraft_') && e.key === 'Enter') { document.querySelector(`[data-action="buyerAddAlias"][data-id="${el.id.replace('buyerAliasDraft_', '')}"]`)?.click(); }
  if ((el.id === 'loginId' || el.id === 'loginPw') && e.key === 'Enter') { doLogin(S.loginId || '', S.loginPw || ''); }
  if ((el.id === 'dbCfgUrl' || el.id === 'dbCfgKey') && e.key === 'Enter') { e.preventDefault(); saveDbConfigFromModal(); }
}

function initDelegatedEvents() {
  appEl.addEventListener('click', handleClick);
  appEl.addEventListener('dblclick', handleDblClick);
  appEl.addEventListener('change', handleChange);
  appEl.addEventListener('input', handleInput);
  appEl.addEventListener('focusin', handleFocusCapture, true);
  appEl.addEventListener('focusout', handleBlurCapture, true);
  appEl.addEventListener('keydown', handleKeydown);
}

function wireOneTimeHandlers() {
  if (S.showDbConfigModal) {
    const urlEl = document.getElementById('dbCfgUrl');
    if (urlEl && document.activeElement !== urlEl && document.activeElement !== document.getElementById('dbCfgKey')) urlEl.focus();
    return;
  }
  if (S.authChecked && !S.isAuthenticated) {
    const idEl = document.getElementById('loginId');
    if (idEl && document.activeElement !== idEl && document.activeElement !== document.getElementById('loginPw')) idEl.focus();
  }
}

// ============================================================================
// 12. 부트스트랩
// ============================================================================
initSupabaseClient();
initDelegatedEvents();
render();
window.__APP_BOOTED__ = true;

} // end boot()

boot().catch((err) => {
  console.error('boot() failed:', err);
  showBootError('앱을 초기화하지 못했습니다', String(err && err.message || err));
});
</script>
</body>
