function initSupabaseClient() {
  const cfg = getStoredDbConfig();
  SUPABASE_URL = cfg.url;
  SUPABASE_ANON_KEY = cfg.key;

  if (authUnsubscribe) { try { authUnsubscribe(); } catch (e) {} authUnsubscribe = null; }
  if (realtimeChannel) { try { supabase.removeChannel(realtimeChannel); } catch (e) {} realtimeChannel = null; }

  if (!isDbConfigured()) {
    supabase = null;
    S.authChecked = true;
    S.isAuthenticated = false;
    return;
  }

  supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    realtime: { params: { eventsPerSecond: 5 } }
  });

  const { data: sub } = supabase.auth.onAuthStateChange((event, session) => {
    const user = session?.user || null;
    if (user) {
      S.currentUser = { id: emailToId(user.email), name: user.user_metadata?.name || emailToId(user.email) };

      S.authChecked = true;

      S.post = { searchTerm: '', onlyMissing: false, popup: null };
      render();
    }
  });
  authUnsubscribe = () => sub?.subscription?.unsubscribe?.();
}

const formatDeliveryDate = (val) => {
  const strVal = String(val).trim();
  if (/^\d{8}$/.test(strVal)) {
    return `${strVal.slice(0, 4)}-${strVal.slice(4, 6)}-${strVal.slice(6, 8)}`;
  }
  return strVal;
};

const normalizeDeliveryForSort = (val) => {
  if (!val) return '';
  const strVal = String(val).trim();
  if (/^\d{8}$/.test(strVal)) return `${strVal.slice(0, 4)}-${strVal.slice(4, 6)}-${strVal.slice(6, 8)}`;
  if (/^\d{6}$/.test(strVal)) return `20${strVal.slice(0, 2)}-${strVal.slice(2, 4)}-${strVal.slice(4, 6)}`;
  const parts = strVal.split(/[-/.]/);
  if (parts.length >= 3) {
    let year = parts[0];
    if (year.length === 2) year = '20' + year;
    return `${year}-${parts[1].padStart(2, '0')}-${parts[2].padStart(2, '0')}`;
  }
  return strVal;
};

const getMonthKey = (val) => {
  if (!val) return 'TBD';
  const strVal = String(val).trim();
  if (/^\d{8}$/.test(strVal)) return `${strVal.slice(0, 4)}-${strVal.slice(4, 6)}`;
  if (/^\d{6}$/.test(strVal)) return `20${strVal.slice(0, 2)}-${strVal.slice(2, 4)}`;
  const parts = strVal.split(/[-/.]/);
  if (parts.length >= 2) {
    let year = parts[0];
    if (year.length === 2) year = '20' + year;
    const month = parts[1].padStart(2, '0');
    return `${year}-${month}`;
  }
  return 'TBD';
};

const calculateRowCosts = (row) => {
  const sizeSum = (Number(row.s) || 0) + (Number(row.m) || 0) + (Number(row.l) || 0) + (Number(row.xl) || 0) + (Number(row.xxl) || 0);
  // ✅ 사이즈별 수량이 없으면 Total 수동 입력값(qtyTotal) 사용
  const totalQty = sizeSum > 0 ? sizeSum : (Number(row.qtyTotal) || 0);
  const fab1LossRate = 1 + ((Number(row.fab1Loss) || 0) / 100);
  const fab2LossRate = 1 + ((Number(row.fab2Loss) || 0) / 100);

  const fab1Cost = (Number(row.fab1Cons) || 0) * (Number(row.fab1Price) || 0) * fab1LossRate;
  const fab2Cost = (Number(row.fab2Cons) || 0) * (Number(row.fab2Price) || 0) * fab2LossRate;
  const totalFabricCost = fab1Cost + fab2Cost;

  const totalTrimCost = (Number(row.trimThread) || 0) + (Number(row.trimButton) || 0) + (Number(row.trimPrint) || 0) + (Number(row.trimLabel) || 0) + (Number(row.trimOther) || 0);
  const unitCmtCost = Number(row.cmt) || 0;

  const unitTotalCost = totalFabricCost + totalTrimCost + unitCmtCost;
  const amount = totalQty * (Number(row.fob) || 0);
  const profit = (Number(row.fob) || 0) - unitTotalCost;
  const totalProfit = profit * totalQty;
  const profitMargin = Number(row.fob) > 0 ? (profit / Number(row.fob)) * 100 : 0;

  return { ...row, totalQty, totalFabricCost, totalTrimCost, unitTotalCost, amount, profit, totalProfit, profitMargin };
};

// CSV
const parseCSV = (text) => {
  const rows = [];
  let row = [];
  let field = '';
  let inQuotes = false;
  const src = text.replace(/^\ufeff/, '');

  for (let i = 0; i < src.length; i++) {
    const c = src[i];
    if (inQuotes) {
      if (c === '"') {
        if (src[i + 1] === '"') { field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && src[i + 1] === '\n') i++;
        row.push(field); field = '';
        if (row.length > 1 || row[0] !== '') rows.push(row);
        row = [];
      } else field += c;
    }
  }
  if (field !== '' || row.length > 0) { row.push(field); if (row.length > 1 || row[0] !== '') rows.push(row); }
  return rows;
};

// 숫자 → 베트남어 문장
const VN_DIGITS = ['không', 'một', 'hai', 'ba', 'bốn', 'năm', 'sáu', 'bảy', 'tám', 'chín'];

const readTripleVN = (n, showZeroHundred) => {
  const tr = Math.floor(n / 100);
  const ch = Math.floor((n % 100) / 10);
  const dv = n % 10;
  let s = '';
  if (tr > 0 || showZeroHundred) s += VN_DIGITS[tr] + ' trăm';
  if (ch > 1) {
    s += ' ' + VN_DIGITS[ch] + ' mươi';
    if (dv === 1) s += ' mốt';
    else if (dv === 5) s += ' lăm';
    else if (dv > 0) s += ' ' + VN_DIGITS[dv];
  } else if (ch === 1) {
    s += ' mười';
    if (dv === 5) s += ' lăm';
    else if (dv > 0) s += ' ' + VN_DIGITS[dv];
  } else if (dv > 0) {
    if (s) s += ' lẻ';
    s += ' ' + VN_DIGITS[dv];
  }
  return s.trim();
};

const numberToVietnameseWords = (num) => {
  num = Math.round(Math.abs(num));
  if (num === 0) return 'Không đồng.';
  const units = ['', ' nghìn', ' triệu', ' tỷ', ' nghìn tỷ', ' triệu tỷ'];
  const groups = [];
  while (num > 0) { groups.push(num % 1000); num = Math.floor(num / 1000); }
  const parts = [];
  for (let i = groups.length - 1; i >= 0; i--) {
    if (groups[i] === 0) continue;
    const isFirst = i === groups.length - 1;
    parts.push(readTripleVN(groups[i], !isFirst) + units[i]);
  }
  const result = parts.join(' ').trim() + ' đồng';
  return result.charAt(0).toUpperCase() + result.slice(1) + '.';
};

// 숫자 → 영어 문장
const EN_ONES = ['', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten',
  'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen', 'eighteen', 'nineteen'];
const EN_TENS = ['', '', 'twenty', 'thirty', 'forty', 'fifty', 'sixty', 'seventy', 'eighty', 'ninety'];

const readTripleEN = (n) => {
  let s = '';
  const h = Math.floor(n / 100);
  const rest = n % 100;
  if (h > 0) s += EN_ONES[h] + ' hundred';
  if (rest > 0) {
    if (s) s += ' and ';
    if (rest < 20) s += EN_ONES[rest];
    else {
      s += EN_TENS[Math.floor(rest / 10)];
      if (rest % 10 > 0) s += '-' + EN_ONES[rest % 10];
    }
  }
  return s;
};

const numberToEnglishWords = (num) => {
  num = Math.round(Math.abs(num));
  if (num === 0) return 'Zero Vietnamese dong.';
  const scales = ['', ' thousand', ' million', ' billion', ' trillion'];
  const groups = [];
  while (num > 0) { groups.push(num % 1000); num = Math.floor(num / 1000); }
  const parts = [];
  for (let i = groups.length - 1; i >= 0; i--) {
    if (groups[i] === 0) continue;
    parts.push(readTripleEN(groups[i]) + scales[i]);
  }
  const result = parts.join(', ') + ' Vietnamese dong.';
  return result.charAt(0).toUpperCase() + result.slice(1);
};

const esc = (v) => String(v === null || v === undefined ? '' : v)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

const fmtMoney = (n, digits = 0) => '$' + Number(n || 0).toLocaleString(undefined, { minimumFractionDigits: digits, maximumFractionDigits: Math.max(digits, 0) });
const fmtInt = (n) => Number(n || 0).toLocaleString();

// ── 입력창용 콤마 포맷 (편집 중엔 원시 숫자, blur 시 000,000.00 형태로 표시) ──
function fmtInputVal(v, digits = 0) {
  if (v === '' || v === null || v === undefined) return '';
  const n = Number(String(v).replace(/,/g, ''));
  if (isNaN(n)) return v;
  return n.toLocaleString(undefined, { minimumFractionDigits: digits, maximumFractionDigits: digits });
}
// 단위 접미사가 붙은 콤마 포맷 숫자 입력창 (VND/USD/PCS 공용) — inputAttrs는 data-* 문자열
function numInputUnit(inputAttrs, value, unit, digits, extraCls, placeholder) {
  const disp = fmtInputVal(value, digits);
  return `<div class="relative">
    <input type="text" inputmode="decimal" data-fmt="${digits}" ${inputAttrs} value="${esc(disp)}" ${placeholder ? `placeholder="${esc(placeholder)}"` : ''} class="w-full text-sm border border-slate-200 rounded-lg pl-2 pr-9 py-1.5 text-right focus:outline-none focus:ring-2 focus:ring-purple-400 focus:border-purple-300 ${extraCls || ''}" />
    <span class="pointer-events-none absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 font-medium" style="font-size:10px">${unit}</span>
  </div>`;
}

let skipNextRealtime = false;
let realtimeChannel = null;

async function loadAll(showAlert = false) {
  if (!supabase) return;
  S.isRefreshing = true; renderHeaderBadge();
  try {
    const [{ data: orders, error: e1 }, { data: sups, error: e2 }, { data: byrs, error: e3 }, { data: meta, error: e4 }] = await Promise.all([
      supabase.from(TABLES.orders).select('payload'),
      supabase.from(TABLES.suppliers).select('payload'),
      supabase.from(TABLES.buyers).select('payload'),
      supabase.from(TABLES.meta).select('payload').eq('id', 'company').maybeSingle()
    ]);
    if (e1) throw e1; if (e2) throw e2; if (e3) throw e3;
    if (orders && orders.length > 0) S.data = orders.map(r => r.payload);
    if (sups && sups.length > 0) S.suppliers = sups.map(r => r.payload);
    S.buyers = (byrs || []).map(r => r.payload);
    if (meta && meta.payload) S.myCompany = { ...initialCompany, ...meta.payload };

    // ✅ 사후 실적(actuals) 로드 — 테이블이 아직 없어도 사전 모드 동작에는 지장 없도록 별도 처리
    try {
      const { data: acts, error: eA } = await supabase.from(TABLES.actuals).select('id, payload');
      if (!eA && acts) { const m = {}; acts.forEach(r => { m[r.id] = r.payload; }); S.actuals = m; }
      else if (eA) console.warn('actuals load skipped:', eA.message);
    } catch (eAct) { console.warn('actuals load skipped:', eAct); }

    S.saveStatus = 'idle';
    if (showAlert) window.alert(L().alertRefreshed);
  } catch (err) {
    console.error('load error:', err);
    S.saveStatus = 'error';
    if (showAlert) window.alert('데이터를 불러오지 못했습니다.\n' + (err.message || ''));
  } finally {
    S.isRefreshing = false;
    render();
  }
}

function subscribeRealtime() {
  if (!supabase || realtimeChannel) return;
  realtimeChannel = supabase.channel('orders-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: TABLES.orders }, async () => {
      if (skipNextRealtime) { skipNextRealtime = false; return; }
      const { data: orders, error } = await supabase.from(TABLES.orders).select('payload');
      if (!error) { S.data = (orders || []).map(r => r.payload); render(); }
    })
    .subscribe();
}

// ✅ 오더 전체 교체 저장 (CSV 가져오기 등 대량 교체 시에만 사용)
async function saveData(newData) {
  const cleaned = stripImages(newData);
  S.data = cleaned;
  const validIds = new Set(cleaned.map(r => r.id));
  S.selectedRowIds = new Set([...S.selectedRowIds].filter(id => validIds.has(id)));
  render();

  flashStatus('saving');
  try {
    const { data: existing, error: exErr } = await supabase.from(TABLES.orders).select('id');
    if (exErr) throw exErr;
    const existingIds = new Set((existing || []).map(r => String(r.id)));
    const newIds = new Set(cleaned.map(r => String(r.id)));
    const idsToDelete = [...existingIds].filter(id => !newIds.has(id));

    const CHUNK = 450;
    for (let i = 0; i < cleaned.length; i += CHUNK) {
      const rows = cleaned.slice(i, i + CHUNK).map(r => ({ id: String(r.id), payload: r }));
      const { error } = await supabase.from(TABLES.orders).upsert(rows);
      if (error) throw error;
    }
    for (let i = 0; i < idsToDelete.length; i += CHUNK) {
      const { error } = await supabase.from(TABLES.orders).delete().in('id', idsToDelete.slice(i, i + CHUNK));
      if (error) throw error;
    }
    skipNextRealtime = true;
    flashStatus('saved');
  } catch (err) {
    console.error('save error:', err);
    flashStatus('error');
  }
}

// ✅ 부분 저장(Upsert/Delete) — 셀 하나 편집 시 그 행만 저장, 700ms 디바운스
const pendingUpserts = new Map();
let upsertTimer = null;

async function flushUpserts() {
  if (pendingUpserts.size === 0) return;
  const rows = [...pendingUpserts.values()];
  pendingUpserts.clear();
  flashStatus('saving');
  try {
    const payload = rows.map(r => ({ id: String(r.id), payload: r }));
    const { error } = await supabase.from(TABLES.orders).upsert(payload);
    if (error) throw error;
    skipNextRealtime = true;
    flashStatus('saved');
  } catch (err) {
    console.error('upsert error:', err);
    flashStatus('error');
    rows.forEach(r => pendingUpserts.set(r.id, r));
  }
}

function queueUpsertRow(row) {
  pendingUpserts.set(row.id, row);
  if (upsertTimer) clearTimeout(upsertTimer);
  upsertTimer = setTimeout(flushUpserts, 700);
}

window.addEventListener('beforeunload', () => { if (pendingUpserts.size > 0) flushUpserts(); });

// (행 upsert 실제 구현은 registerBuyerIfNew를 포함한 아래쪽 handleUpsertRow 에서 처리)

async function handleDeleteOrderRow(id) {

    const { error } = await supabase.from(TABLES.orders).delete().eq('id', String(id));
    if (error) throw error;
    skipNextRealtime = true;
    flashStatus('saved');
  } catch (err) {
    console.error('delete error:', err);
    flashStatus('error');
  }
}

  S.isLoading = true; S.loginError = ''; render();
  try {
    const { error } = await supabase.auth.signInWithPassword({ email: idToEmail(loginId), password: loginPw });
    if (error) {
      const msg = (error.message || '').toLowerCase();
      S.loginError = (msg.includes('invalid') || msg.includes('credential'))
        ? '아이디 또는 비밀번호가 올바르지 않습니다.'
        : (msg.includes('fetch') ? 'DB 서버에 연결할 수 없습니다. "DB 연결" 버튼에서 URL/키가 올바른지 확인해주세요.' : (error.message || '로그인에 실패했습니다.'));
    }
  } catch (err) {
    const msg = String(err && err.message || err || '');
    S.loginError = msg.toLowerCase().includes('fetch')
      ? 'DB 서버에 연결할 수 없습니다. "DB 연결" 버튼에서 URL/키가 올바른지 확인해주세요.'
      : (msg || '로그인 중 오류가 발생했습니다.');
  } finally {
    S.isLoading = false; render();
  }
}

}

const METRICS = [
  { key: 'sales', label: '매출 (Sales)', hue: 160, color: '#10b981', format: (v) => '$' + v.toLocaleString(undefined, { maximumFractionDigits: 0 }) },
  { key: 'profit', label: '이익 (Profit)', hue: 199, color: '#0ea5e9', format: (v) => '$' + v.toLocaleString(undefined, { maximumFractionDigits: 0 }) },
  { key: 'qty', label: '수량 (Q\'ty)', hue: 258, color: '#8b5cf6', format: (v) => v.toLocaleString() + ' pcs' }
];
const monthShade = (hue, idx) => `hsl(${hue + (idx % 4) * 4}, ${58 + (idx % 3) * 6}%, ${40 + (idx % 6) * 4}%)`;
const DONUT_COLORS = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#14b8a6', '#f97316', '#6366f1', '#84cc16'];
const formatCompact = (n) => {
  if (!n) return '$0';
  const abs = Math.abs(n);
  if (abs >= 1e6) return '$' + (n / 1e6).toFixed(1) + 'M';
  if (abs >= 1e3) return '$' + (n / 1e3).toFixed(1) + 'K';
  return '$' + n.toFixed(0);
};

}

function donutChartSvg(data, valueKey, size = 100, strokeWidth = 16) {
  const total = data.reduce((s, d) => s + (d[valueKey] || 0), 0);
  const radius = (size - strokeWidth) / 2;
  const circumference = 2 * Math.PI * radius;
  let offsetAcc = 0;
  const circles = data.map((d, i) => {
    const value = d[valueKey] || 0;
    const fraction = total > 0 ? value / total : 0;
    const dash = Math.max(fraction * circumference - (data.length > 1 ? 1.5 : 0), 0);
    const gap = circumference - dash;
    const c = `<circle cx="${size / 2}" cy="${size / 2}" r="${radius}" fill="none" stroke="${DONUT_COLORS[i % DONUT_COLORS.length]}" stroke-width="${strokeWidth}" stroke-dasharray="${dash} ${gap}" stroke-dashoffset="${-offsetAcc}" stroke-linecap="round" />`;
    offsetAcc += fraction * circumference;
    return c;
  }).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" class="shrink-0">
    <g transform="rotate(-90 ${size / 2} ${size / 2})">
      <circle cx="${size / 2}" cy="${size / 2}" r="${radius}" fill="none" stroke="#f1f5f9" stroke-width="${strokeWidth}" />
      ${circles}
    </g>
    <text x="50%" y="47%" text-anchor="middle" dominant-baseline="middle" class="fill-slate-800" style="font-size:${size * 0.13}px;font-weight:700;">${formatCompact(total)}</text>
    <text x="50%" y="63%" text-anchor="middle" dominant-baseline="middle" class="fill-slate-400" style="font-size:${size * 0.09}px;font-weight:600;">TOTAL</text>
  </svg>`;
}

function monthlyChartHtml(data, metricKey, Lx) {
  if (data.length === 0) return `<div class="text-center text-slate-400 py-10 text-sm">${Lx.noData}</div>`;

  if (metricKey === 'all') {
    const maxByMetric = {};
    METRICS.forEach(m => { maxByMetric[m.key] = Math.max(...data.map(d => Math.abs(d[m.key] || 0)), 1); });
    const legend = METRICS.map(m => `<span class="flex items-center gap-1.5 text-xs text-slate-600"><span class="inline-block w-3 h-3 rounded-sm" style="background-color:${m.color}"></span>${Lx.metric[m.key]}</span>`).join('');
    const bars = data.map((d, idx) => {
      const cols = METRICS.map(m => {
        const val = d[m.key] || 0;
        const isNeg = val < 0;
        const hPercent = Math.max((Math.abs(val) / maxByMetric[m.key]) * 100, val === 0 ? 0 : 2);
        return `<div class="flex flex-col items-center justify-end h-full group" style="width:30%" title="${esc(d.month)} · ${esc(m.label)} : ${esc(m.format(val))}">
          <div class="w-full rounded-t transition-all group-hover:opacity-75" style="height:${hPercent}%;background-color:${isNeg ? '#ef4444' : monthShade(m.hue, idx)};min-height:${val !== 0 ? '4px' : '1px'};"></div>
        </div>`;
      }).join('');
      return `<div class="flex flex-col items-center justify-end flex-1 h-full" style="min-width:84px">
        <div class="flex items-end justify-center gap-1 w-full h-full">${cols}</div>
        <span class="text-slate-500 mt-1.5 whitespace-nowrap border-t border-slate-200 w-full text-center pt-1" style="font-size:10px">${esc(d.month)}</span>
        <span class="text-slate-400 whitespace-nowrap" style="font-size:9px">${esc(METRICS[0].format(d.sales))} · ${fmtInt(d.qty)}p</span>
      </div>`;
    }).join('');
    return `<div>
      <div class="flex items-center justify-end gap-4 px-4 pt-3">${legend}<span class="text-slate-400" style="font-size:10px">${Lx.scaleNote}</span></div>
      <div class="flex items-end gap-3 px-2 pt-4 pb-1 overflow-x-auto" style="height:230px">${bars}</div>
    </div>`;
  }

  const metric = METRICS.find(m => m.key === metricKey) || METRICS[0];
  const values = data.map(d => d[metricKey] || 0);
  const maxVal = Math.max(...values, 1);
  const minVal = Math.min(...values, 0);
  const range = maxVal - Math.min(minVal, 0) || 1;
  const bars = data.map((d, idx) => {
    const val = d[metricKey] || 0;
    const isNeg = val < 0;
    const hPercent = Math.max((Math.abs(val) / range) * 100, val === 0 ? 0 : 2);
    return `<div class="flex flex-col items-center justify-end flex-1 h-full group" style="min-width:52px" title="${esc(d.month)} : ${esc(metric.format(val))}">
      <span class="font-bold text-slate-600 mb-1 whitespace-nowrap opacity-80 group-hover:opacity-100" style="font-size:10px">${esc(metric.format(val))}</span>
      <div class="w-full rounded-t transition-all group-hover:opacity-80" style="height:${hPercent}%;background-color:${isNeg ? '#ef4444' : monthShade(metric.hue, idx)};min-height:${val !== 0 ? '4px' : '1px'};"></div>
      <span class="text-slate-500 mt-1.5 whitespace-nowrap border-t border-slate-200 w-full text-center pt-1" style="font-size:10px">${esc(d.month)}</span>
    </div>`;
  }).join('');
  return `<div class="flex items-end gap-2 px-2 pt-6 pb-1 overflow-x-auto" style="height:220px">${bars}</div>`;
}

function computeDashboard() {
  const buyerAliasMap = new Map();
  S.buyers.forEach(b => { buyerAliasMap.set(b.name, b.name); (b.aliases || []).forEach(a => buyerAliasMap.set(a, b.name)); });

  const baseData = S.data.map(row => {
    const calc = calculateRowCosts(row);
    const rawBuyer = String(calc.buyer || '').trim();
    const canonical = buyerAliasMap.get(rawBuyer);
    return canonical && canonical !== calc.buyer ? { ...calc, buyer: canonical } : calc;
  });

  const buyerOptions = ['ALL', ...new Set(baseData.map(r => r.buyer).filter(Boolean))].sort ? ['ALL', ...[...new Set(baseData.map(r => r.buyer).filter(Boolean))].sort()] : ['ALL'];
  const globalAvailableYears = [...new Set(baseData.map(r => { const mk = getMonthKey(r.delivery); return mk !== 'TBD' ? mk.split('-')[0] : null; }).filter(Boolean))].sort();

  const { buyer: selBuyer, year: selYear } = S.dash;
  let orders = 0, qty = 0, sales = 0, profit = 0;
  baseData.forEach(row => {
    if (row.status === 'Cancel') return;
    if (selBuyer !== 'ALL' && row.buyer !== selBuyer) return;
    if (selYear !== 'ALL') { const mk = getMonthKey(row.delivery); const year = mk !== 'TBD' ? mk.split('-')[0] : 'TBD'; if (year !== selYear) return; }
    orders += 1; qty += row.totalQty; sales += row.amount; profit += row.totalProfit;
  });
  const summary = { orders, qty, sales, profit, margin: sales > 0 ? (profit / sales) * 100 : 0 };

  const stStats = { Open: { status: 'Open', count: 0, qty: 0, sales: 0, profit: 0 }, Invoiced: { status: 'Invoiced', count: 0, qty: 0, sales: 0, profit: 0 }, Cancel: { status: 'Cancel', count: 0, qty: 0, sales: 0, profit: 0 } };
  baseData.forEach(row => {
    if (selBuyer !== 'ALL' && row.buyer !== selBuyer) return;
    if (selYear !== 'ALL') { const mk = getMonthKey(row.delivery); const year = mk !== 'TBD' ? mk.split('-')[0] : 'TBD'; if (year !== selYear) return; }
    const st = stStats[row.status] || stStats['Open'];
    st.count += 1; st.qty += row.totalQty; st.sales += row.amount; st.profit += row.totalProfit;
  });
  const statusStatsList = ['Open', 'Invoiced', 'Cancel'].map(k => ({ status: k, styles: stStats[k].count, qty: stStats[k].qty, sales: stStats[k].sales, profit: stStats[k].profit }));
  const statusTotal = {
    styles: stStats.Open.count + stStats.Invoiced.count, qty: stStats.Open.qty + stStats.Invoiced.qty,
    sales: stStats.Open.sales + stStats.Invoiced.sales, profit: stStats.Open.profit + stStats.Invoiced.profit
  };

  const buyerStatsMap = {};
  baseData.forEach(row => {
    if (row.status === 'Cancel' || !row.buyer) return;
    if (selYear !== 'ALL') { const mk = getMonthKey(row.delivery); const year = mk !== 'TBD' ? mk.split('-')[0] : 'TBD'; if (year !== selYear) return; }
    if (!buyerStatsMap[row.buyer]) buyerStatsMap[row.buyer] = { buyer: row.buyer, qty: 0, sales: 0, profit: 0 };
    buyerStatsMap[row.buyer].qty += row.totalQty; buyerStatsMap[row.buyer].sales += row.amount; buyerStatsMap[row.buyer].profit += row.totalProfit;
  });
  const buyerStatsList = Object.values(buyerStatsMap).sort((a, b) => b.sales - a.sales);
  const buyerTotalSales = buyerStatsList.reduce((s, b) => s + b.sales, 0);

  const { itemBuyer, itemYear, item: itemSel } = S.dash;
  const itemStatsMap = {}; let itemTotalSales = 0;
  baseData.forEach(row => {
    if (row.status === 'Cancel' || !row.item) return;
    if (itemBuyer !== 'ALL' && row.buyer !== itemBuyer) return;
    if (itemYear !== 'ALL') { const mk = getMonthKey(row.delivery); const year = mk !== 'TBD' ? mk.split('-')[0] : 'TBD'; if (year !== itemYear) return; }
    if (!itemStatsMap[row.item]) itemStatsMap[row.item] = { item: row.item, qty: 0, sales: 0, profit: 0 };
    itemStatsMap[row.item].qty += row.totalQty; itemStatsMap[row.item].sales += row.amount; itemStatsMap[row.item].profit += row.totalProfit;
    itemTotalSales += row.amount;
  });
  const itemStatsList = Object.values(itemStatsMap).sort((a, b) => b.sales - a.sales);

  const { monthBuyer, monthYear: selMonthYearFilter, month: selMonthFilter } = S.dash;
  const monthStatsMap = {}; const monthYears = new Set();
  baseData.forEach(row => {
    if (row.status === 'Cancel') return;
    if (monthBuyer !== 'ALL' && row.buyer !== monthBuyer) return;
    const mk = getMonthKey(row.delivery);
    if (mk !== 'TBD') monthYears.add(mk.split('-')[0]);
    if (selMonthYearFilter !== 'ALL') { const year = mk !== 'TBD' ? mk.split('-')[0] : 'TBD'; if (year !== selMonthYearFilter) return; }
    if (selMonthFilter !== 'ALL') { const month = mk !== 'TBD' ? mk.split('-')[1] : 'TBD'; if (month !== selMonthFilter) return; }
    if (!monthStatsMap[mk]) monthStatsMap[mk] = { month: mk, qty: 0, sales: 0, profit: 0 };
    monthStatsMap[mk].qty += row.totalQty; monthStatsMap[mk].sales += row.amount; monthStatsMap[mk].profit += row.totalProfit;
  });
  const monthStatsList = Object.values(monthStatsMap).sort((a, b) => a.month.localeCompare(b.month));
  const availableYears = [...monthYears].sort();

  return { baseData, buyerOptions, globalAvailableYears, summary, statusStatsList, statusTotal, buyerStatsList, buyerTotalSales, itemStatsList, itemTotalSales, monthStatsList, availableYears };
}

function renderDashboard() {
  const Lx = L();

const CHECK_COL_WIDTH = 34;

function registerBuyerIfNew(name) {
  const trimmed = String(name || '').trim();
  if (!trimmed) return;
  const exists = S.buyers.some(b => b.name === trimmed);
  if (exists) return;
  const newBuyer = { id: 'buyer-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6), name: trimmed, aliases: [] };
  saveBuyers([...S.buyers, newBuyer]);
}

function handleUpsertRow(row, insertAfterId) {
  const cleanRow = stripImages([row])[0];
  const idx = S.data.findIndex(r => r.id === cleanRow.id);
  if (idx >= 0) { S.data = S.data.map(r => r.id === cleanRow.id ? cleanRow : r); }
  else if (insertAfterId != null) {
    const afterIdx = S.data.findIndex(r => r.id === insertAfterId);
    const next = [...S.data]; next.splice(afterIdx >= 0 ? afterIdx + 1 : next.length, 0, cleanRow); S.data = next;
  } else { S.data = [...S.data, cleanRow]; }
  queueUpsertRow(cleanRow);
  registerBuyerIfNew(cleanRow.buyer);
}

function computeProcessedData() {
  let calculated = S.data.map(calculateRowCosts);
  const term = S.sheet.searchTerm.trim().toLowerCase();
  if (term) {
    calculated = calculated.filter(row => {
      const haystack = [row.buyer, row.style, row.item, row.po, row.color].map(v => String(v ?? '').toLowerCase()).join(' ');
      return haystack.includes(term);
    });
  }
  if (S.sheet.sortKey) {
    const key = S.sheet.sortKey; const dir = S.sheet.sortDir === 'asc' ? 1 : -1;
    calculated = [...calculated].sort((a, b) => {
      let va = a[key], vb = b[key];
      if (key === 'delivery') { va = normalizeDeliveryForSort(va); vb = normalizeDeliveryForSort(vb); }
      if (typeof va === 'number' && typeof vb === 'number') return (va - vb) * dir;
      return String(va ?? '').localeCompare(String(vb ?? ''), undefined, { numeric: true }) * dir;
    });
  }
  const groupOrder = []; const groups = new Map();
  calculated.forEach(row => { if (!groups.has(row.style)) { groups.set(row.style, []); groupOrder.push(row.style); } groups.get(row.style).push(row); });
  const finalData = [];
  groupOrder.forEach(style => {
    const groupRows = groups.get(style);
    const subtotal = { style, count: 0, totalQty: 0, amount: 0, totalProfit: 0, s: 0, m: 0, l: 0, xl: 0, xxl: 0, rowIds: [] };
    groupRows.forEach(row => {
      finalData.push({ ...row, isSubtotal: false });
      subtotal.count += 1; subtotal.totalQty += row.totalQty; subtotal.amount += row.amount; subtotal.totalProfit += row.totalProfit;
      subtotal.s += Number(row.s) || 0; subtotal.m += Number(row.m) || 0; subtotal.l += Number(row.l) || 0; subtotal.xl += Number(row.xl) || 0; subtotal.xxl += Number(row.xxl) || 0;
      subtotal.rowIds.push(row.id);
    });
    const subtotalMargin = subtotal.amount > 0 ? (subtotal.totalProfit / subtotal.amount) * 100 : 0;
    finalData.push({ ...subtotal, profitMargin: subtotalMargin, isSubtotal: true, id: 'subtotal-' + style });
  });
  return finalData;
}

function sortHeaderTh(label, sortKey, extraClass, styleAttr, rowSpan, colSpan) {
  const active = S.sheet.sortKey === sortKey;
  const icon = active ? (S.sheet.sortDir === 'asc' ? `<i data-lucide="chevron-up" class="w-3 h-3 text-blue-600"></i>` : `<i data-lucide="chevron-down" class="w-3 h-3 text-blue-600"></i>`) : '';
  return `<th ${rowSpan ? `rowspan="${rowSpan}"` : ''} ${colSpan ? `colspan="${colSpan}"` : ''} ${styleAttr ? `style="${styleAttr}"` : ''}
    ${sortKey ? `data-action="sort" data-val="${sortKey}"` : ''}
    class="px-2 py-2 border-r border-b border-slate-200 font-semibold text-center ${sortKey ? 'cursor-pointer hover:bg-slate-200 transition-colors select-none' : ''} ${extraClass || ''}">
    <div class="flex items-center justify-center gap-1">${esc(label)}${icon}</div>
  </th>`;
}

function checkBtn(checked, action, valId, title) {
  return `<button data-action="${action}" data-id="${esc(valId)}" class="p-0.5 rounded transition-colors ${checked ? 'text-blue-600' : 'text-slate-300 hover:text-slate-500'}" title="${esc(title)}">
    <i data-lucide="${checked ? 'check-square' : 'square'}" class="w-4 h-4"></i></button>`;
}

function renderEditableCell(row, field, format = 'text', align = 'left') {
  const isEditing = S.sheet.editingId === row.id && S.sheet.editingField === field;
  if (isEditing) {
    if (field === 'status') {
      return `<select data-cell-input data-id="${row.id}" data-field="${field}" autofocus class="w-full border-2 border-blue-500 rounded bg-white shadow-sm focus:outline-none px-1 py-1 text-slate-800 text-xs" style="min-width:70px">
        <option value="Open" ${S.sheet.editValue === 'Open' ? 'selected' : ''}>Open</option>
        <option value="Invoiced" ${S.sheet.editValue === 'Invoiced' ? 'selected' : ''}>Invoiced</option>
        <option value="Cancel" ${S.sheet.editValue === 'Cancel' ? 'selected' : ''}>Cancel</option>
      </select>`;
    }
    if (field === 'buyer') {
      const registered = [...new Set(S.buyers.map(b => b.name))].sort();
      const currentIsRegistered = registered.includes(S.sheet.editValue);
      return `<select data-cell-input data-id="${row.id}" data-field="${field}" autofocus class="w-full border-2 border-blue-500 rounded bg-white shadow-sm focus:outline-none px-1 py-1 text-slate-800 text-xs" style="min-width:120px">
        ${(!currentIsRegistered && S.sheet.editValue) ? `<option value="${esc(S.sheet.editValue)}" selected>⚠ ${esc(S.sheet.editValue)} (미등록)</option>` : ''}
        <option value="" ${S.sheet.editValue ? 'disabled' : ''}>바이어 선택...</option>
        ${registered.map(name => `<option value="${esc(name)}" ${S.sheet.editValue === name ? 'selected' : ''}>${esc(name)}</option>`).join('')}
      </select>`;
    }
    return `<input type="text" data-cell-input data-id="${row.id}" data-field="${field}" autofocus value="${esc(S.sheet.editValue)}"
      class="w-full border-2 border-blue-500 rounded bg-white shadow-sm focus:outline-none px-1 py-1 text-slate-800 text-xs ${align === 'right' ? 'text-right' : 'text-left'}"
      style="min-width:50px" placeholder="${field === 'delivery' ? 'YYYYMMDD' : ''}" />`;
  }

  let displayValue = row[field];
  if (format === 'status') {
    const statusColors = { Open: 'bg-blue-50 text-blue-600 border-blue-200', Invoiced: 'bg-emerald-50 text-emerald-600 border-emerald-200', Cancel: 'bg-red-50 text-red-600 border-red-200' };
    const badgeClass = statusColors[displayValue] || 'bg-slate-50 text-slate-600 border-slate-200';
    return `<div data-action="editCell" data-id="${row.id}" data-field="${field}" data-format="status" class="cursor-pointer px-1 py-0.5 rounded border text-center font-bold transition-colors ${badgeClass}" style="font-size:10px" title="더블클릭하여 상태 변경">${esc(displayValue || 'Open')}</div>`;
  }
  if (format === 'currency') displayValue = '$' + Number(row[field] || 0).toFixed(2);
  else if (format === 'cons') displayValue = Number(row[field] || 0).toFixed(3);
  else if (format === 'percent') displayValue = Number(row[field] || 0) + '%';
  else if (format === 'number') displayValue = Number(row[field] || 0).toLocaleString();

  const shown = displayValue || (format === 'text' ? `<span class="text-slate-300 italic">...</span>` : esc(displayValue));
  return `<div data-action="editCell" data-id="${row.id}" data-field="${field}" data-format="${format}" data-align="${align}" class="cursor-pointer hover:bg-blue-100 hover:ring-1 hover:ring-blue-300 rounded px-1 py-1 -mx-1 transition-colors text-xs ${align === 'right' ? 'text-right' : 'text-left'}" style="min-height:20px" title="더블클릭하여 수정 (Tab으로 이동)">${format === 'text' && !displayValue ? shown : esc(displayValue)}</div>`;
}

function handleAddRow() {
  const newRow = { id: Date.now(), buyer: '', status: 'Open', style: 'NEW STYLE', item: 'NEW ITEM', po: 'NEW-PO', delivery: '', color: 'COLOR',
    s: 0, m: 0, l: 0, xl: 0, xxl: 0, qtyTotal: 0, fab1Name: 'FABRIC 1', fab1Loss: 0, fab1Cons: 0, fab1Price: 0, fab2Name: '', fab2Loss: 0, fab2Cons: 0, fab2Price: 0,
    trimThread: 0, trimButton: 0, trimPrint: 0, trimLabel: 0, trimOther: 0, cmt: 0, fob: 0 };
  handleUpsertRow(newRow);
  S.sheet.searchTerm = '';
  S.sheet.highlightRowId = newRow.id;
  S.sheet.editingId = newRow.id; S.sheet.editingField = 'buyer'; S.sheet.editValue = '';

  highlightTimer = setTimeout(() => { S.sheet.highlightRowId = null; render(); }, 2500);

  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });

function handleInsertRowAfter(sourceRow) {
  const newRow = {
    id: Date.now(), buyer: sourceRow.buyer || '', status: sourceRow.status || 'Open', style: sourceRow.style || '', item: sourceRow.item || '',
    po: sourceRow.po || '', delivery: sourceRow.delivery || '', color: '',

    fab1Name: sourceRow.fab1Name || '', fab1Loss: sourceRow.fab1Loss || 0, fab1Cons: sourceRow.fab1Cons || 0, fab1Price: sourceRow.fab1Price || 0,
    fab2Name: sourceRow.fab2Name || '', fab2Loss: sourceRow.fab2Loss || 0, fab2Cons: sourceRow.fab2Cons || 0, fab2Price: sourceRow.fab2Price || 0,
    trimThread: sourceRow.trimThread || 0, trimButton: sourceRow.trimButton || 0, trimPrint: sourceRow.trimPrint || 0, trimLabel: sourceRow.trimLabel || 0, trimOther: sourceRow.trimOther || 0,
    cmt: sourceRow.cmt || 0, fob: sourceRow.fob || 0
  };
  handleUpsertRow(newRow, sourceRow.id);
  S.sheet.searchTerm = '';

}

function toggleRow(id) { if (S.selectedRowIds.has(id)) S.selectedRowIds.delete(id); else S.selectedRowIds.add(id); render(); }

function toggleAllRows(ids) { S.selectedRowIds = new Set(ids); render(); }

function openContractFromHeader() {
  if (S.selectedRowIds.size === 0) { window.alert(L().alertSelectFirst); return; }

// ── CSV Export / Import ──
function handleExportCSV() {
  const headers = ['id', 'buyer', 'status', 'style', 'item', 'po', 'delivery', 'color', 's', 'm', 'l', 'xl', 'xxl', 'qtyTotal', 'fob', 'fab1Name', 'fab1Loss', 'fab1Cons', 'fab1Price', 'fab2Name', 'fab2Loss', 'fab2Cons', 'fab2Price', 'trimThread', 'trimButton', 'trimPrint', 'trimLabel', 'trimOther', 'cmt'];
  const csvRows = [headers.map(csvEscape).join(',')];
  S.data.forEach(row => { csvRows.push(headers.map(h => csvEscape(row[h])).join(',')); });
  const blob = new Blob(['\ufeff' + csvRows.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `CostingMaster_Data_${new Date().toISOString().slice(0, 10)}.csv`;
  link.click();
  URL.revokeObjectURL(link.href);
}

function handleImportCSVFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (event) => {
    try {
      const parsed = parseCSV(event.target.result);
      if (parsed.length < 2) { window.alert(L().alertNoData); return; }
      const headers = parsed[0].map(h => h.trim());
      const headerAlias = { qtytotal: 'qtyTotal', totalqty: 'qtyTotal', total: 'qtyTotal', qty: 'qtyTotal', "totalq'ty": 'qtyTotal', 'q\u2019ty': 'qtyTotal', quantity: 'qtyTotal' };
      const normHeaders = headers.map(h => { const norm = h.toLowerCase().replace(/[\s_()-]/g, ''); return headerAlias[norm] || h; });
      const newData = [];
      for (let i = 1; i < parsed.length; i++) {
        const values = parsed[i];
        if (values.every(v => !String(v).trim())) continue;
        const newRow = {};
        headers.forEach((h0, idx) => {
          const h = normHeaders[idx];
          if (h === 'imageUrl') return;
          let val = values[idx] !== undefined ? values[idx] : '';
          if (numericFields.includes(h)) val = val ? Number(String(val).replace(/,/g, '').trim()) || 0 : 0;
          else val = String(val).trim();
          newRow[h] = val;
        });
        if (!newRow.id) newRow.id = Date.now() + i;
        if (!newRow.status) newRow.status = 'Open';
        if (!newRow.buyer) newRow.buyer = 'UNKNOWN';
        if (newRow.delivery) newRow.delivery = formatDeliveryDate(newRow.delivery);
        newData.push(newRow);
      }
      if (newData.length === 0) { window.alert(L().alertNoData); return; }
      saveData(newData);
      window.alert(L().alertImported(newData.length));
    } catch (err) {
      console.error(err);
      window.alert(L().alertImportErr);
    }
  };
  reader.readAsText(file);
}

function trimSuppliersList() { return S.suppliers.filter(s => s.type === '부자재' || s.type === '기타'); }

}
function selectableContractRows() { return S.data.map(calculateRowCosts).filter(r => r.status !== 'Cancel'); }

function regenerateLines() {
  const picked = selectableContractRows().filter(r => CM.selectedIds.has(r.id));
  if (CM.docType === 'fabric') {
    const newLines = [];
    picked.forEach(r => {
      const q1 = Math.ceil(r.totalQty * (Number(r.fab1Cons) || 0) * (1 + (Number(r.fab1Loss) || 0) / 100));
      if (r.fab1Name && q1 > 0) newLines.push({ lineId: r.id + '-fab1', name: r.fab1Name, style: r.style, color: r.color, qty: q1, priceUsd: Number(r.fab1Price) || 0 });
      const q2 = Math.ceil(r.totalQty * (Number(r.fab2Cons) || 0) * (1 + (Number(r.fab2Loss) || 0) / 100));
      if (r.fab2Name && q2 > 0) newLines.push({ lineId: r.id + '-fab2', name: r.fab2Name, style: r.style, color: r.color, qty: q2, priceUsd: Number(r.fab2Price) || 0 });
    });
    CM.lines = newLines;
  } else {
    const merged = new Map();
    picked.forEach(r => {
      const key = (r.style || '') + '||' + (r.color || '');
      if (!merged.has(key)) merged.set(key, { style: r.style, color: r.color, qty: 0 });
      merged.get(key).qty += r.totalQty;
    });
    const newLines = [];
    [...merged.values()].forEach(g => {
      TRIM_TYPES.forEach(t => {
        if (!CM.selectedTrims.has(t.key)) return;
        newLines.push({ lineId: (g.style || 'x') + '||' + (g.color || 'x') + '-' + t.key, trimName: t.nameEN, style: g.style, garmentColor: g.color, trimColor: g.color || '',
          qtyGarment: g.qty, cons: t.defCons, loss: 3, unit: t.defUnit, orderQty: '', priceVnd: 0, priceManual: false });
      });
    });
    CM.lines = newLines;
    if (picked.length > 0 && !CM.poBuyerName) CM.poBuyerName = picked[0].buyer;
  }
}

function updateLine(lineId, field, value) { CM.lines = CM.lines.map(l => l.lineId === lineId ? { ...l, [field]: value } : l); render(); }
function updateLinePrice(lineId, value) {
  const idx = CM.lines.findIndex(l => l.lineId === lineId);
  if (idx === -1) return;
  const name = CM.lines[idx].trimName;
  CM.lines = CM.lines.map((l, i) => {
    if (i === idx) return { ...l, priceVnd: value, priceManual: true };
    if (i > idx && l.trimName === name && !l.priceManual) return { ...l, priceVnd: value };
    return l;
  });
  render();
}
function removeLine(lineId) { CM.lines = CM.lines.filter(l => l.lineId !== lineId); render(); }

function computeFabric() {
  const items = CM.lines.map(l => {
    const qty = Number(l.qty) || 0, priceUsd = Number(l.priceUsd) || 0;
    const priceVnd = Math.round(priceUsd * (Number(CM.rate) || 0));
    return { ...l, qty, priceUsd, priceVnd, ttl: qty * priceVnd };
  });
  const totalQty = items.reduce((s, i) => s + i.qty, 0);
  const totalVnd = items.reduce((s, i) => s + i.ttl, 0);
  const vatVnd = Math.round(totalVnd * (Number(CM.vatPercent) || 0) / 100);
  return { items, totalQty, totalVnd, vatVnd, grandTotal: totalVnd + vatVnd };
}
function computeTrim() {
  const items = CM.lines.map(l => {
    const qtyGarment = Number(l.qtyGarment) || 0, cons = Number(l.cons) || 0, loss = Number(l.loss) || 0;
    const need = qtyGarment * cons * (1 + loss / 100);
    const autoOrder = Math.ceil(need * 100) / 100;
    const orderQty = l.orderQty === '' || l.orderQty === null ? autoOrder : Number(l.orderQty) || 0;
    const isAuto = l.orderQty === '' || l.orderQty === null;
    const priceVnd = Number(l.priceVnd) || 0;
    const amount = Math.round(orderQty * priceVnd);
    return { ...l, qtyGarment, cons, loss, need, orderQty, isAuto, priceVnd, amount };
  });
  const totalNeed = items.reduce((s, i) => s + i.need, 0);
  const totalOrder = items.reduce((s, i) => s + i.orderQty, 0);
  const totalAmount = items.reduce((s, i) => s + i.amount, 0);
  return { items, totalNeed, totalOrder, totalAmount };
}

    <span class="shrink-0 text-slate-700" style="width:${labelWidth}px">${label}:</span>
    <input data-party="${target}" data-field="${field}" class="party-input flex-1 bg-transparent focus:outline-none text-slate-900" style="min-width:0;padding:0 2px" value="${esc(value || '')}" />
  </div>`;
}
function partyBlockHtml(labelVN, labelEN, party, target) {
  return `<div class="mb-4" style="font-size:13px;line-height:1.9">
    <div class="flex items-center justify-between border-b-2 border-slate-800 pb-1 mb-1.5" style="gap:8px">
      <p class="font-bold whitespace-nowrap">${labelVN} <span class="font-normal italic">(${labelEN})</span><span class="mx-2">-</span>
        <input data-party="${target}" data-field="nameVN" class="party-input font-bold bg-transparent focus:outline-none" style="width:340px;padding:0 2px" value="${esc(party.nameVN || '')}" />
      </p>
    </div>
    ${partyFieldHtml('Địa chỉ (Address)', 'address', party.address, 200, target)}
    <div class="flex flex-wrap" style="gap:0 24px">
      <div style="flex:1 1 45%;min-width:260px">${partyFieldHtml('Mã số thuế (Tax code)', 'taxCode', party.taxCode, 160, target)}</div>
      <div style="flex:1 1 45%;min-width:260px">${partyFieldHtml('Điện thoại (Tel)', 'tel', party.tel, 130, target)}</div>
    </div>
    <div class="flex flex-wrap" style="gap:0 24px">
      <div style="flex:1 1 45%;min-width:260px">${partyFieldHtml('Đại diện (Represented by)', 'rep', party.rep, 185, target)}</div>
      <div style="flex:1 1 45%;min-width:260px">${partyFieldHtml('Chức vụ (Position)', 'position', party.position, 140, target)}</div>

    ${partyFieldHtml('Tại ngân hàng (At bank)', 'bank', party.bank, 175, target)}

}

    <p class="pl-4">▪ Dung sai đơn hàng là +/-5% về số lượng và giá trị. / 5PCT more or less in quantity and amount are acceptable.</p>
    <p class="mb-3 pl-4">▪ Bên A chịu trách nhiệm về chất lượng vải, có phương pháp xử lý để đảm bảo đúng tiến độ, số lượng cho bên B. / Party A is responsible for the quality of the fabric, has a processing method to ensure the schedule and quantity for Party B.</p>
    <p class="font-bold">ĐIỀU 7: PHƯƠNG THỨC THANH TOÁN / <span class="italic">ARTICLE 7: PAYMENT METHOD</span></p>
    <p class="pl-4">▪ Thanh toán 100% sau khi giao hết vải trong vòng 30 ngày kể từ ngày chốt công nợ cuối tháng. / Pay 100% after delivery of the fabric within 30 days from the date of closing the debt at the end of the month.</p>
    <p class="mb-3 pl-4">▪ Đồng tiền thanh toán / Payment currency: Đồng (VNĐ).</p>
    <p class="font-bold">ĐIỀU 8: ĐIỀU KHOẢN CHUNG / <span class="italic">ARTICLE 8: GENERAL ITEMS</span></p>
    <p class="pl-4">▪ Hợp đồng có hiệu lực từ ngày ký và sẽ tự động thanh lý sau khi hai bên hoàn thành việc giao hàng và thanh toán công nợ. / This Agreement shall come into effect after the Parties' signing and automatic liquidation of this contract after completing the delivery of goods and payment.</p>

// ── 인쇄 / PDF 저장 (DOM 기반 — React 버전과 동일 방식) ──
function buildPrintableHtml() {
  const node = document.getElementById('contract-print');
  if (!node) return null;
  const clone = node.cloneNode(true);
  const srcFields = node.querySelectorAll('input, select');
  const dstFields = clone.querySelectorAll('input, select');
  dstFields.forEach((el, i) => {
    const src = srcFields[i];
    let text = '';
    if (src) text = src.tagName === 'SELECT' ? (src.options[src.selectedIndex]?.text || src.value || '') : (src.value || '');
    const span = document.createElement('span');
    span.textContent = text;
    if (src) {
      const cs = window.getComputedStyle(src);
      span.setAttribute('style', 'display:inline-block;white-space:pre-wrap;text-align:' + cs.textAlign + ';font-weight:' + cs.fontWeight + ';');
    }
    el.parentNode.replaceChild(span, el);
  });
  clone.querySelectorAll('.no-print').forEach(el => el.remove());
  clone.querySelectorAll('*').forEach(el => { if (el.style && el.style.borderBottom && el.style.borderBottom.includes('dotted')) el.style.borderBottom = 'none'; });
  const isTrim = CM.docType === 'trim';
  const rawTitle = isTrim ? (CM.poNo || 'PURCHASE_ORDER') : (CM.contractNo || 'CONTRACT');
  const docTitle = rawTitle.replace(/[\\/:*?"<>|]/g, '-');
  const css = `
@page { size: A4; margin: 12mm; } * { box-sizing: border-box; }
body { margin: 0; background: #fff; color: #0f172a; font-family: ${isTrim ? "'Segoe UI', Arial, sans-serif" : "'Times New Roman', Times, serif"}; font-size: ${isTrim ? '10.5px' : '12px'}; line-height: 1.6; }
table { border-collapse: collapse; width: 100%; margin-bottom: 8px; }
td, th { border: 1px solid #475569; padding: 3px 5px; vertical-align: middle; }
thead td, thead th { background: #e2e8f0 !important; font-weight: bold; text-align: center; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
h1 { font-size: ${isTrim ? '19px' : '17px'}; margin: 3px 0; letter-spacing: ${isTrim ? '3px' : '0'}; } h2 { font-size: 15px; margin: 3px 0; } p { margin: 2px 0; }
b, strong, .font-bold { font-weight: bold; } i, em, .italic { font-style: italic; } .not-italic { font-style: normal; }
.text-center { text-align: center; } .text-right { text-align: right; } .flex { display: flex; } .justify-between { justify-content: space-between; } .justify-center { justify-content: center; }
.items-baseline { align-items: baseline; } .items-center { align-items: center; } .flex-wrap { flex-wrap: wrap; } .grid { display: grid; }
.grid-cols-2 { grid-template-columns: 1fr 1fr; } .grid-cols-3 { grid-template-columns: 1fr 1fr 1fr; } .gap-4 { gap: 16px; } .gap-8 { gap: 32px; } .pl-4 { padding-left: 14px; }
.mb-1 { margin-bottom: 4px; } .mb-2 { margin-bottom: 8px; } .mb-3 { margin-bottom: 12px; } .mb-4 { margin-bottom: 16px; } .mb-6 { margin-bottom: 22px; }
.mt-8 { margin-top: 28px; } .mt-10 { margin-top: 34px; } .mx-2 { margin-left: 8px; margin-right: 8px; } .ml-2 { margin-left: 8px; }
.border-b-2 { border-bottom: 2px solid #0f172a; padding-bottom: 4px; margin-bottom: 6px; } .border-t { border-top: 1px solid #94a3b8; }
.inline-block { display: inline-block; } .px-6 { padding-left: 22px; padding-right: 22px; } .px-8 { padding-left: 30px; padding-right: 30px; } .pt-1 { padding-top: 4px; }
.space-y-1 > * + * { margin-top: 3px; } .shrink-0 { flex-shrink: 0; } .flex-1 { flex: 1; } .text-slate-500, .text-slate-600 { color: #475569; } .whitespace-nowrap { white-space: nowrap; }
tr { page-break-inside: avoid; } thead { display: table-header-group; }`;
  return { html: clone.innerHTML, css, docTitle };
}

function handleExportPdf() {
  if (CM.isExporting) return;
  CM.isExporting = true; render();
  try {
    const built = buildPrintableHtml();
    if (!built) return;
    const win = window.open('', '_blank', 'width=900,height=1000');
    if (!win) { window.alert('팝업이 차단되었습니다. 주소창 옆의 팝업 차단 아이콘에서 이 사이트를 허용해주세요.'); return; }
    win.document.open();
    win.document.write('<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><title>' + built.docTitle + '</title><style>' + built.css + '</style></head><body>' + built.html +
      '<script>window.onload=function(){setTimeout(function(){window.focus();window.print();},350);window.onafterprint=function(){window.close();};};<\/script></body></html>');
    win.document.close();
  } catch (err) {
    console.error('print error', err);
    window.alert('인쇄 중 오류가 발생했습니다: ' + (err?.message || ''));
  } finally {
    setTimeout(() => { CM.isExporting = false; render(); }, 600);
  }
}

function handleDownloadHtml() {
  const built = buildPrintableHtml();
  if (!built) return;
  const html = '<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><title>' + built.docTitle + '</title><style>' + built.css + 'body{padding:12mm;}</style></head><body>' + built.html + '</body></html>';
  const blob = new Blob(['\ufeff' + html], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url; link.download = built.docTitle + '.html'; link.click();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

// 8.5 사후 실적 관리 (Post / Actual Cost Management)
//     - Invoiced 오더만 스타일 단위로 묶어 실제 출고수량/매출/지불대금(VND) 관리
//     - VND 입력 → 건별 환율로 USD 환산, 사전(계획) 대비 실제 이익 비교
// ============================================================================
const LAST_RATE_KEY = 'costing-master-last-rate';

async function saveActual(styleKey, payload) {
  S.actuals = { ...S.actuals, [styleKey]: payload };
  flashStatus('saving');
  try {
    const { error } = await supabase.from(TABLES.actuals).upsert({ id: String(styleKey), payload });
    if (error) throw error;
    flashStatus('saved');
  } catch (err) {
    console.error('saveActual error:', err);
    flashStatus('error');
    window.alert('실적 저장에 실패했습니다.\nSupabase에 add_actuals_table.sql 을 실행했는지 확인해주세요.\n\n' + (err.message || ''));
  }
}

async function deleteActual(styleKey) {
  const next = { ...S.actuals };
  delete next[styleKey];
  S.actuals = next;
  flashStatus('saving');
  try {
    const { error } = await supabase.from(TABLES.actuals).delete().eq('id', String(styleKey));
    if (error) throw error;
    flashStatus('saved');
  } catch (err) {
    console.error('deleteActual error:', err);
    flashStatus('error');
  }
}

// ── 스타일 단위 원단/부자재 항목 분해: {key,label,qty,unitCost,costSum} 배열 ──
//    같은 이름의 fab1/fab2/trim이 여러 라인(컬러/PO)에 걸쳐 있으면 수량가중평균으로 합산
//    부자재 라벨은 계약서 모달과 동일한 TRIM_TYPES 사전을 재사용해 다국어를 맞춘다.
const TRIM_ITEM_FIELD_MAP = { thread: 'trimThread', button: 'trimButton', print: 'trimPrint', label: 'trimLabel', other: 'trimOther' };

function styleCostItems(style) {
  const P = L().post;
  const rows = S.data.filter(r => String(r.style || '(스타일 없음)') === style);
  const isUniqlo = rows.some(r => /uniqlo/i.test(String(r.buyer || '')));
  const map = new Map();
  const addItem = (key, label, qty, unitCost) => {
    if (!label || !(qty > 0) || !(unitCost > 0)) return;
    if (!map.has(key)) map.set(key, { key, label, qty: 0, costSum: 0 });
    const it = map.get(key);
    it.qty += qty;
    it.costSum += qty * unitCost;
    it.label = label; // 이름이 다른 라인이 섞여도 최신 라벨로 표시 (수량가중 합산은 그대로 유지)
  };
  rows.forEach(row => {
    const calc = calculateRowCosts(row);
    const qty = calc.totalQty;
    // ✅ 원단명이 비어있어도(예: UNIQLO) 단가만 있으면 항목으로 노출 — 슬롯(fab1/fab2) 기준으로 고정 키 사용
    const loss1 = 1 + (Number(row.fab1Loss) || 0) / 100;
    addItem('fab1', row.fab1Name || P.fabricUnnamed1, qty, (Number(row.fab1Cons) || 0) * (Number(row.fab1Price) || 0) * loss1);
    const loss2 = 1 + (Number(row.fab2Loss) || 0) / 100;
    addItem('fab2', row.fab2Name || P.fabricUnnamed2, qty, (Number(row.fab2Cons) || 0) * (Number(row.fab2Price) || 0) * loss2);
    TRIM_TYPES.filter(t => TRIM_ITEM_FIELD_MAP[t.key]).forEach(t => {
      // ✅ UNIQLO는 부자재를 세부항목 대신 'ACC Total'(액세서리 합계) 하나로 관리하는 관행 → label 항목명만 치환
      const label = (isUniqlo && t.key === 'label') ? 'ACC Total' : trimLabel(t, S.lang);
      addItem('trim:' + t.key, label, qty, Number(row[TRIM_ITEM_FIELD_MAP[t.key]]) || 0);
    });
    // ✅ CM(공임/Sewing) — 가장 중요한데 빠져있던 항목. 다른 항목과 동일하게 사전단가 vs 실제단가 비교 가능
    addItem('cmt', P.itemCmLabel, qty, Number(row.cmt) || 0);
  });
  return [...map.values()].map(it => ({ ...it, unitCost: it.qty > 0 ? it.costSum / it.qty : 0 }));
}

// ── 사후 데이터 계산: Invoiced 오더 → 스타일 그룹 + 실적 결합 ──
function computePostData() {
  const calc = S.data.map(calculateRowCosts).filter(r => String(r.status) === 'Invoiced');
  const groups = new Map();
  calc.forEach(r => {
    const key = String(r.style || '(스타일 없음)');
    if (!groups.has(key)) groups.set(key, { style: key, buyers: new Set(), items: new Set(), lines: 0, orderQty: 0, plannedSales: 0, plannedFabricUsd: 0, plannedTrimUsd: 0, cmtTotal: 0, monthTally: {} });
    const g = groups.get(key);
    if (r.buyer) g.buyers.add(r.buyer);
    if (r.item) g.items.add(r.item);
    g.lines += 1;
    g.orderQty += r.totalQty;
    g.plannedSales += r.amount;
    g.plannedFabricUsd += r.totalFabricCost * r.totalQty;
    g.plannedTrimUsd += r.totalTrimCost * r.totalQty;
    g.cmtTotal += (Number(r.cmt) || 0) * r.totalQty;
    const mk = getMonthKey(r.delivery);
    if (mk !== 'TBD') g.monthTally[mk] = (g.monthTally[mk] || 0) + r.totalQty;
  });

  let list = [...groups.values()].map(g => {
    const avgFob = g.orderQty > 0 ? g.plannedSales / g.orderQty : 0;
    const cmtUnit = g.orderQty > 0 ? g.cmtTotal / g.orderQty : 0;
    const a = S.actuals[g.style] || null;
    const shippedQty = a ? Number(a.shippedQty) || 0 : 0;
    const rate = a ? Number(a.rate) || 0 : 0;
    const autoSales = shippedQty * avgFob;
    const actualSales = a ? ((a.actualSalesUsd === '' || a.actualSalesUsd == null) ? autoSales : Number(a.actualSalesUsd) || 0) : 0;
    let paidVnd = 0;
    if (a) {
      if (a.items) paidVnd += Object.values(a.items).reduce((s, v) => s + (Number(v) || 0), 0);
      paidVnd += Number(a.otherPaidVnd) || 0;
      paidVnd += Number(a.packingPaidVnd) || 0;
      // 구버전 호환: items 없이 fabricPaidVnd/trimPaidVnd만 있던 저장분
      if (!a.items) paidVnd += (Number(a.fabricPaidVnd) || 0) + (Number(a.trimPaidVnd) || 0);
    }
    const paidUsd = (a && rate > 0) ? paidVnd / rate : 0;
    const fabricPaidVnd = a ? (a.items ? Object.keys(a.items).filter(k => k.startsWith('fab')).reduce((s, k) => s + (Number(a.items[k]) || 0), 0) : (Number(a.fabricPaidVnd) || 0)) : 0;
    const trimPaidVnd = a ? (a.items ? Object.keys(a.items).filter(k => k.startsWith('trim')).reduce((s, k) => s + (Number(a.items[k]) || 0), 0) : (Number(a.trimPaidVnd) || 0)) : 0;
    const cmPaidVnd = a ? (a.items ? (Number(a.items['cmt']) || 0) : 0) : 0;
    const packingPaidVnd = a ? (Number(a.packingPaidVnd) || 0) : 0;
    const cmtActual = cmtUnit * shippedQty; // 참고용 (계획 CMT 기준) — 실제이익 계산에는 더이상 별도로 빼지 않음 (paidUsd의 'cmt' 항목에 포함됨)
    const actualProfit = a ? actualSales - paidUsd : 0;
    const plannedProfit = g.plannedSales - g.plannedFabricUsd - g.plannedTrimUsd - g.cmtTotal;
    // 대표 월(月): 이 스타일의 라인들 중 수량이 가장 많은 납기월을 대표값으로 사용 (실적 KPI 월별 차트용)
    let repMonth = 'TBD', repMax = -1;
    Object.keys(g.monthTally).forEach(mk => { if (g.monthTally[mk] > repMax) { repMax = g.monthTally[mk]; repMonth = mk; } });
    return {
      ...g, buyers: [...g.buyers].join(', '), buyerList: [...g.buyers], items: [...g.items], repMonth,
      avgFob, cmtUnit, a, shippedQty, rate, autoSales, actualSales,
      fabricPaidVnd, trimPaidVnd, cmPaidVnd, packingPaidVnd, paidVnd, paidUsd, cmtActual, actualProfit, plannedProfit
    };
  });

  const term = S.post.searchTerm.trim().toLowerCase();
  if (term) list = list.filter(g => (g.style + ' ' + g.buyers).toLowerCase().includes(term));
  list.sort((x, y) => String(x.style).localeCompare(String(y.style)));

  const doneList = list.filter(g => g.a);
  const missingList = list.filter(g => !g.a);
  const entered = doneList;
  const totals = {
    styles: list.length,
    done: entered.length,
    missing: missingList.length,
    shippedQty: entered.reduce((s, g) => s + g.shippedQty, 0),
    actualSales: entered.reduce((s, g) => s + g.actualSales, 0),
    paidUsd: entered.reduce((s, g) => s + g.paidUsd, 0),
    paidVnd: entered.reduce((s, g) => s + g.paidVnd, 0),
    actualProfit: entered.reduce((s, g) => s + g.actualProfit, 0),
    plannedSales: entered.reduce((s, g) => s + g.plannedSales, 0),
    plannedProfit: entered.reduce((s, g) => s + g.plannedProfit, 0)
  };
  return { list, doneList, missingList, totals };
}

// ── 실적 KPI 집계: 입력완료 스타일만 대상으로 바이어별 / 월별 실제 실적 집계 ──
// ── 연동형(cascading) 필터 옵션 계산: year → buyer → (item|style) 순으로 선택지를 좁혀감 ──
function postCascadeOptions(filterState, thirdKey) {
  const { doneList } = computePostData();
  const buyerSet = new Set();
  doneList.forEach(g => g.buyerList.forEach(b => buyerSet.add(b)));
  const buyerOptions = [...buyerSet].sort();

  const buyerFiltered = filterState.buyer === 'ALL' ? doneList : doneList.filter(g => g.buyerList.includes(filterState.buyer));
  const allYears = [...new Set(buyerFiltered.map(g => g.repMonth !== 'TBD' ? g.repMonth.split('-')[0] : null).filter(Boolean))].sort();

  const yearFiltered = filterState.year === 'ALL' ? buyerFiltered : buyerFiltered.filter(g => g.repMonth !== 'TBD' && g.repMonth.split('-')[0] === filterState.year);
  let thirdOptions;
  if (thirdKey === 'item') {
    const itemSet = new Set();
    yearFiltered.forEach(g => g.items.forEach(it => itemSet.add(it)));
    thirdOptions = [...itemSet].sort();
  } else {
    thirdOptions = yearFiltered.map(g => g.style).sort();
  }

  let finalList = yearFiltered;
  if (thirdKey === 'item' && filterState.item !== 'ALL') finalList = finalList.filter(g => g.items.includes(filterState.item));
  if (thirdKey === 'style' && filterState.style !== 'ALL') finalList = finalList.filter(g => g.style === filterState.style);

  return { allYears, buyerOptions, thirdOptions, finalList };
}

function computePostKPI() {
  const { totals: totalsAll } = computePostData();
  const f = S.post.kpiFilter;
  const { allYears, buyerOptions, thirdOptions: itemOptions, finalList: doneList } = postCascadeOptions(f, 'item');

  const buyerMap = {};
  const monthMap = {};
  doneList.forEach(g => {
    const bKey = g.buyers || '(no buyer)';
    if (!buyerMap[bKey]) buyerMap[bKey] = { buyer: bKey, sales: 0, profit: 0, qty: 0 };
    buyerMap[bKey].sales += g.actualSales; buyerMap[bKey].profit += g.actualProfit; buyerMap[bKey].qty += g.shippedQty;

    const mk = g.repMonth;
    if (mk !== 'TBD') {
      if (!monthMap[mk]) monthMap[mk] = { month: mk, sales: 0, profit: 0, qty: 0 };
      monthMap[mk].sales += g.actualSales; monthMap[mk].profit += g.actualProfit; monthMap[mk].qty += g.shippedQty;
    }
  });
  const buyerStatsList = Object.values(buyerMap).sort((a, b) => b.sales - a.sales);
  const monthStatsList = Object.values(monthMap).sort((a, b) => a.month.localeCompare(b.month));
  // 필터 적용된 doneList 기준으로 totals 재계산 (전체 대상 스타일 수는 필터와 무관하게 totalsAll 사용)
  const totals = {
    ...totalsAll,
    done: doneList.length,
    shippedQty: doneList.reduce((s, g) => s + g.shippedQty, 0),
    actualSales: doneList.reduce((s, g) => s + g.actualSales, 0),
    paidUsd: doneList.reduce((s, g) => s + g.paidUsd, 0),
    paidVnd: doneList.reduce((s, g) => s + g.paidVnd, 0),
    actualProfit: doneList.reduce((s, g) => s + g.actualProfit, 0),
    plannedSales: doneList.reduce((s, g) => s + g.plannedSales, 0),
    plannedProfit: doneList.reduce((s, g) => s + g.plannedProfit, 0)
  };
  const achieveRate = totals.plannedSales > 0 ? (totals.actualSales / totals.plannedSales) * 100 : 0;
  const profitDiff = totals.actualProfit - totals.plannedProfit;
  return { totals, buyerStatsList, monthStatsList, achieveRate, profitDiff, allYears, buyerOptions, itemOptions };
}

function computePostCompare() {
  const f = S.post.compareFilter;
  const { allYears, buyerOptions, thirdOptions: styleOptions, finalList: doneList } = postCascadeOptions(f, 'style');

  const totals = {
    plannedSales: doneList.reduce((s, g) => s + g.plannedSales, 0),
    actualSales: doneList.reduce((s, g) => s + g.actualSales, 0),
    plannedProfit: doneList.reduce((s, g) => s + g.plannedProfit, 0),
    actualProfit: doneList.reduce((s, g) => s + g.actualProfit, 0)
  };

  const overall = {
    plannedSales: totals.plannedSales, actualSales: totals.actualSales,
    plannedProfit: totals.plannedProfit, actualProfit: totals.actualProfit,
    achieveRate: totals.plannedSales > 0 ? (totals.actualSales / totals.plannedSales) * 100 : 0,
    plannedMargin: totals.plannedSales > 0 ? (totals.plannedProfit / totals.plannedSales) * 100 : 0,
    actualMargin: totals.actualSales > 0 ? (totals.actualProfit / totals.actualSales) * 100 : 0
  };
  overall.profitDiff = overall.actualProfit - overall.plannedProfit;

  const buyerMap = {};
  doneList.forEach(g => {
    const key = g.buyers || '(no buyer)';
    if (!buyerMap[key]) buyerMap[key] = { buyer: key, plannedSales: 0, actualSales: 0, plannedProfit: 0, actualProfit: 0 };
    const b = buyerMap[key];
    b.plannedSales += g.plannedSales; b.actualSales += g.actualSales;
    b.plannedProfit += g.plannedProfit; b.actualProfit += g.actualProfit;
  });
  const byBuyer = Object.values(buyerMap).map(b => ({
    ...b,
    achieveRate: b.plannedSales > 0 ? (b.actualSales / b.plannedSales) * 100 : 0,
    profitDiff: b.actualProfit - b.plannedProfit
  })).sort((a, b) => b.actualSales - a.actualSales);

  let plannedFabric = 0, plannedTrim = 0, plannedCm = 0;
  let actualFabricUsd = 0, actualTrimUsd = 0, actualCmUsd = 0, actualPackingUsd = 0;
  doneList.forEach(g => {
    plannedFabric += g.plannedFabricUsd; plannedTrim += g.plannedTrimUsd; plannedCm += g.cmtTotal;
    const rate = g.rate || 0;
    if (rate > 0) {
      actualFabricUsd += g.fabricPaidVnd / rate;
      actualTrimUsd += g.trimPaidVnd / rate;
      actualCmUsd += g.cmPaidVnd / rate;
      actualPackingUsd += g.packingPaidVnd / rate;
    }
  });
  const P0 = L().post;
  const costRows = [
    { label: P0.compareCatFabric, planned: plannedFabric, actual: actualFabricUsd, type: 'cost' },
    { label: P0.compareCatTrim, planned: plannedTrim, actual: actualTrimUsd, type: 'cost' },
    { label: P0.compareCatCm, planned: plannedCm, actual: actualCmUsd, type: 'cost' },
    { label: P0.compareCatPacking, planned: 0, actual: actualPackingUsd, type: 'cost' }
  ].map(c => ({ ...c, diff: c.actual - c.planned, pct: c.planned > 0 ? (c.actual / c.planned) * 100 : null }));

  const totalPlannedCost = plannedFabric + plannedTrim + plannedCm; // 포장은 사전 계획치가 없어 총원가 비교 기준에서 제외 (실제만 존재)
  const totalActualCost = actualFabricUsd + actualTrimUsd + actualCmUsd + actualPackingUsd;
  const revenueRow = { label: P0.compareCatSales, planned: totals.plannedSales, actual: totals.actualSales, type: 'revenue', diff: totals.actualSales - totals.plannedSales, pct: totals.plannedSales > 0 ? (totals.actualSales / totals.plannedSales) * 100 : null };
  const totalCostRow = { label: P0.compareCatTotalCost, planned: totalPlannedCost, actual: totalActualCost, type: 'total', diff: totalActualCost - totalPlannedCost, pct: totalPlannedCost > 0 ? (totalActualCost / totalPlannedCost) * 100 : null };
  const plannedMarginFinal = totals.plannedSales > 0 ? ((totals.plannedSales - totalPlannedCost) / totals.plannedSales) * 100 : 0;
  const actualMarginFinal = totals.actualSales > 0 ? ((totals.actualSales - totalActualCost) / totals.actualSales) * 100 : 0;
  const marginRow = { label: P0.compareCatMargin, plannedPct: plannedMarginFinal, actualPct: actualMarginFinal, diffPct: actualMarginFinal - plannedMarginFinal, type: 'margin' };

  const byCategory = [revenueRow, ...costRows, totalCostRow, marginRow];

  const monthMap = {};
  doneList.forEach(g => {
    const mk = g.repMonth;
    if (mk === 'TBD') return;
    if (!monthMap[mk]) monthMap[mk] = { month: mk, plannedSales: 0, actualSales: 0, plannedProfit: 0, actualProfit: 0 };
    monthMap[mk].plannedSales += g.plannedSales; monthMap[mk].actualSales += g.actualSales;
    monthMap[mk].plannedProfit += g.plannedProfit; monthMap[mk].actualProfit += g.actualProfit;
  });
  const byMonth = Object.values(monthMap).sort((a, b) => a.month.localeCompare(b.month));

  const styleRanking = doneList.map(g => ({
    style: g.style, buyers: g.buyers, plannedProfit: g.plannedProfit, actualProfit: g.actualProfit,
    diff: g.actualProfit - g.plannedProfit,
    plannedMargin: g.plannedSales > 0 ? (g.plannedProfit / g.plannedSales) * 100 : 0,
    actualMargin: g.actualSales > 0 ? (g.actualProfit / g.actualSales) * 100 : 0
  })).sort((a, b) => a.diff - b.diff); // 오름차순: 계획보다 많이 나빠진 스타일이 먼저 보임

  return { overall, byBuyer, byCategory, byMonth, styleRanking, count: doneList.length, allYears, buyerOptions, styleOptions };
}

function compareBarPair(labelPlanned, labelActual, planned, actual, formatFn, colorActual) {
  const max = Math.max(planned, actual, 1);
  const pPct = Math.max((planned / max) * 100, planned !== 0 ? 2 : 0);
  const aPct = Math.max((actual / max) * 100, actual !== 0 ? 2 : 0);
  return `<div class="space-y-1.5">
    <div class="flex items-center gap-2">
      <span class="text-xs text-slate-400 shrink-0" style="width:56px">${labelPlanned}</span>
      <div class="flex-1 bg-slate-100 rounded-full h-4 overflow-hidden"><div class="bg-slate-300 h-full rounded-full" style="width:${pPct}%"></div></div>
      <span class="text-xs font-semibold text-slate-500 shrink-0" style="width:90px;text-align:right">${formatFn(planned)}</span>
    </div>
    <div class="flex items-center gap-2">
      <span class="text-xs text-slate-400 shrink-0" style="width:56px">${labelActual}</span>
      <div class="flex-1 bg-slate-100 rounded-full h-4 overflow-hidden"><div class="${colorActual} h-full rounded-full" style="width:${aPct}%"></div></div>
      <span class="text-xs font-bold text-slate-800 shrink-0" style="width:90px;text-align:right">${formatFn(actual)}</span>
    </div>
  </div>`;
}

// ── 종결보고: 출고율 100% 이상(완전 출고)인 종결 스타일을 바이어/월로 분석 ──
function computePostClosing() {
  const { list } = computePostData(); // ✅ Invoiced 처리된 건은 실적 입력 여부와 무관하게 전부 종결보고 대상

  const f = S.post.closingFilter;
  const buyerOptions = [...new Set(list.flatMap(g => g.buyerList))].sort();
  const buyerFiltered = f.buyer === 'ALL' ? list : list.filter(g => g.buyerList.includes(f.buyer));
  const allYears = [...new Set(buyerFiltered.map(g => g.repMonth !== 'TBD' ? g.repMonth.split('-')[0] : null).filter(Boolean))].sort();
  const yearFiltered = f.year === 'ALL' ? buyerFiltered : buyerFiltered.filter(g => g.repMonth !== 'TBD' && g.repMonth.split('-')[0] === f.year);
  const monthOptions = [...new Set(yearFiltered.map(g => g.repMonth).filter(m => m !== 'TBD'))].sort();
  const finalList = f.month === 'ALL' ? yearFiltered : yearFiltered.filter(g => g.repMonth === f.month);
  const enteredList = finalList.filter(g => g.a);

  const totals = {
    count: finalList.length,
    entered: enteredList.length,
    plannedSales: finalList.reduce((s, g) => s + g.plannedSales, 0),
    actualSales: finalList.reduce((s, g) => s + g.actualSales, 0), // 미입력 건은 g.actualSales가 0이라 자연히 반영 안 됨
    plannedProfit: finalList.reduce((s, g) => s + g.plannedProfit, 0),
    actualProfit: finalList.reduce((s, g) => s + g.actualProfit, 0)
  };
  const achieveRate = totals.plannedSales > 0 ? (totals.actualSales / totals.plannedSales) * 100 : 0;
  const profitDiff = totals.actualProfit - totals.plannedProfit;

  const buyerMap = {};
  finalList.forEach(g => {
    const key = g.buyers || '(no buyer)';
    if (!buyerMap[key]) buyerMap[key] = { buyer: key, plannedSales: 0, actualSales: 0 };
    buyerMap[key].plannedSales += g.plannedSales; buyerMap[key].actualSales += g.actualSales;
  });
  const byBuyer = Object.values(buyerMap).sort((a, b) => b.plannedSales - a.plannedSales);

  const monthMap = {};
  finalList.forEach(g => {
    const mk = g.repMonth;
    if (mk === 'TBD') return;
    if (!monthMap[mk]) monthMap[mk] = { month: mk, plannedSales: 0, actualSales: 0 };
    monthMap[mk].plannedSales += g.plannedSales; monthMap[mk].actualSales += g.actualSales;
  });
  const byMonth = Object.values(monthMap).sort((a, b) => a.month.localeCompare(b.month));

  const styleList = finalList.map(g => ({
    style: g.style, buyers: g.buyers, month: g.repMonth, entered: !!g.a,
    plannedSales: g.plannedSales, actualSales: g.actualSales,
    plannedProfit: g.plannedProfit, actualProfit: g.actualProfit,
    achieveRate: g.plannedSales > 0 ? (g.actualSales / g.plannedSales) * 100 : 0,
    profitDiff: g.actualProfit - g.plannedProfit
  })).sort((a, b) => (a.month === 'TBD' ? '9999' : a.month).localeCompare(b.month === 'TBD' ? '9999' : b.month) || a.style.localeCompare(b.style));

  // 스타일별 그래프용 — 실적 입력된 것만 (미입력은 실제값이 항상 0이라 그래프에 의미가 없음)
  const byStyle = styleList.filter(s => s.entered).map(s => ({ style: s.style, plannedSales: s.plannedSales, actualSales: s.actualSales }));

  return { totals, achieveRate, profitDiff, byBuyer, byMonth, byStyle, styleList, allYears, buyerOptions, monthOptions };
}

function twoBarChart(data, keyLabel, formatFn, plannedLabel, actualLabel) {
  if (data.length === 0) return '';
  const max = Math.max(...data.map(d => Math.max(d.plannedSales, d.actualSales)), 1);
  return `<div class="flex items-end gap-3 overflow-x-auto pb-1" style="height:170px">
    ${data.map(d => {
      const pH = Math.max((d.plannedSales / max) * 100, 2);
      const aH = Math.max((d.actualSales / max) * 100, 2);
      return `<div class="flex flex-col items-center justify-end h-full shrink-0" style="min-width:64px">
        <div class="flex items-end gap-1 h-full">
          <div class="flex flex-col items-center justify-end h-full" style="width:20px" title="${esc(plannedLabel)}: ${formatFn(d.plannedSales)}"><div class="w-full bg-slate-300 rounded-t" style="height:${pH}%"></div></div>
          <div class="flex flex-col items-center justify-end h-full" style="width:20px" title="${esc(actualLabel)}: ${formatFn(d.actualSales)}"><div class="w-full bg-purple-500 rounded-t" style="height:${aH}%"></div></div>
        </div>
        <span class="text-slate-500 mt-1.5 border-t border-slate-200 w-full text-center pt-1 truncate" style="font-size:10px" title="${esc(d[keyLabel])}">${esc(d[keyLabel])}</span>
      </div>`;
    }).join('')}
  </div>
  <div class="flex items-center gap-4 justify-center mt-2"><span class="flex items-center gap-1.5 text-xs text-slate-500"><span class="w-3 h-3 rounded-sm bg-slate-300 inline-block"></span>${plannedLabel}</span><span class="flex items-center gap-1.5 text-xs text-slate-500"><span class="w-3 h-3 rounded-sm bg-purple-500 inline-block"></span>${actualLabel}</span></div>`;
}

      <option value="ALL" ${f.year === 'ALL' ? 'selected' : ''}>${Lx.allYears}</option>

      ${summaryCard('trending-up', P.cardProfit, fmtMoney(totals.actualProfit) + ' · ' + actualMargin.toFixed(1) + '%', '', getMarginBadgeClass(actualMargin))}
      ${summaryCard('scale', P.kpiProfitDiff, (profitDiff >= 0 ? '+' : '') + fmtMoney(profitDiff), '', profitDiff >= 0 ? 'bg-emerald-50 text-emerald-600' : 'bg-red-50 text-red-600')}

    <div class="grid grid-cols-1 lg:grid-cols-4 gap-4">

      <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden lg:col-span-2">

        <div class="p-4">${twoBarChart(byStyle, 'style', (v) => fmtMoney(v), P.tabPlanned, P.tabActual) || `<p class="text-center text-slate-400 text-sm py-6">${P.closingByStyleEmpty}</p>`}</div>
      </div>
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden lg:col-span-1">
        <div class="p-3 border-b border-slate-100 bg-slate-50 flex items-center gap-2"><i data-lucide="calendar" class="w-4 h-4 text-slate-500"></i><h3 class="font-semibold text-slate-800 text-sm">${P.closingByMonth}</h3></div>
        <div class="p-4">${twoBarChart(byMonth, 'month', (v) => fmtMoney(v), P.tabPlanned, P.tabActual) || `<p class="text-center text-slate-400 text-sm py-6">${Lx.noData}</p>`}</div>

    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">

        <span class="text-xs text-slate-400">${P.cardDone(totals.entered, totals.count > 0 ? Math.round((totals.entered / totals.count) * 100) : 0)}</span>
      </div>
      <div class="overflow-x-auto"><table class="w-full text-xs text-left border-collapse">

          <th class="px-3 py-2 font-semibold">${P.thBuyer}</th>

          <th class="px-2 py-2 font-semibold text-right">${P.thActualSales}</th>

          <th class="px-2 py-2 font-semibold text-right bg-sky-50/60 text-sky-800">${P.closingPlannedProfit}</th>
          <th class="px-2 py-2 font-semibold text-right bg-sky-50/60 text-sky-800">${P.closingActualProfit}</th>

            <td class="px-2 py-2 text-right font-semibold ${s.entered ? 'text-emerald-700' : 'text-slate-300'}">${s.entered ? fmtMoney(s.actualSales) : '-'}</td>
            <td class="px-2 py-2 text-right">${s.entered ? `<span class="px-1.5 py-0.5 rounded font-bold ${s.achieveRate >= 100 ? 'bg-emerald-50 text-emerald-700' : 'bg-amber-50 text-amber-700'}" style="font-size:11px">${s.achieveRate.toFixed(1)}%</span>` : '-'}</td>
            <td class="px-2 py-2 text-right text-slate-500 bg-sky-50/20">${fmtMoney(s.plannedProfit)}</td>
            <td class="px-2 py-2 text-right font-semibold ${s.entered ? 'text-sky-700' : 'text-slate-300'} bg-sky-50/20">${s.entered ? fmtMoney(s.actualProfit) : '-'}</td>
            <td class="px-2 py-2 text-right font-bold ${!s.entered ? 'text-slate-300' : s.profitDiff >= 0 ? 'text-emerald-600' : 'text-red-600'}">${s.entered ? (s.profitDiff >= 0 ? '+' : '') + fmtMoney(s.profitDiff) : '-'}</td>
            <td class="px-2 py-2 text-center">
              ${s.entered
                ? `<span class="inline-flex items-center gap-1 text-emerald-700 bg-emerald-50 border border-emerald-200 rounded-full px-2 py-0.5 font-bold" style="font-size:10px"><i data-lucide="check" class="w-3 h-3"></i> ${P.statusDone}</span>`
                : `<span class="inline-flex items-center gap-1 text-slate-400 bg-slate-50 border border-slate-200 rounded-full px-2 py-0.5 font-medium" style="font-size:10px">${P.statusMissing}</span>`}
